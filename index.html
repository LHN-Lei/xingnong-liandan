  --navy-900:#0A2338;
  --navy-800:#0E2D47;
  --navy-700:#123A5C;
  --navy-600:#1A4A70;
  --navy-100:#DDE7EE;
  --brand:#2F8A5B;
  --brand-d:#26744C;
  --brand-l:#5FA97B;
  --brand-050:#EAF1EB;
  --copper:#A97B45;
  --copper-l:#C8A97A;
  --copper-soft:#F0E7D6;
  --red:#A13C2E;
  --red-soft:#F6E5DF;
  --amber:#9A6A1E;
  --amber-soft:#F6EBD6;
  --blue:#2D5E7A;
  --blue-soft:#E4EDF1;
  --slate:#5B6974;
  /* 兼容旧 token，统一映射到新色系 */
  --green-950:var(--navy-950);
  --green-900:var(--navy-900);
  --green-800:var(--navy-800);
  --green-700:var(--navy-700);
  --green-600:var(--brand-d);
  --green-500:var(--brand);
  --green-100:var(--brand-050);
  --gold:var(--copper);
  --gold-2:var(--copper-l);
  --gold-soft:var(--copper-soft);
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Hiragino Sans GB","Segoe UI",sans-serif;
  --mono:"Cascadia Mono","JetBrains Mono","Consolas","Courier New",monospace;
  --r:2px;
  --rail-w:252px;
  --shadow:0 1px 2px rgba(15,28,43,.04);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:13px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
button{background:none;border:none;padding:0}
::selection{background:#DDE8E2;color:var(--navy-900)}
h1,h2,h3,h4{margin:0;font-weight:600}
p{margin:0}
ul,ol{margin:0;padding:0}
img{max-width:100%}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.serif{font-family:var(--serif)}
.mono{font-family:var(--mono)}
.thin{font-weight:400}

/* 极轻的纸面纹理，不再使用网格点阵 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(0deg,rgba(18,58,92,.012) 0 1px,transparent 1px 5px),
    radial-gradient(1100px 600px at 78% 0%,rgba(47,138,91,.045),transparent 62%);
  opacity:.7;
}

/* =========================================================
   BRAND
   ========================================================= */
.brand-plate{
  display:inline-flex;align-items:center;justify-content:center;
  background:none;border:0;padding:0;line-height:0;
}
.brand-logo{display:block;width:100%;height:auto;max-height:100%;object-fit:contain}
.brand-mark{display:block;width:100%;height:auto;object-fit:contain}
.m-logo{display:block;width:20px;height:20px;flex:0 0 auto}
.m-logo .brand-mark{width:20px;height:20px}
.mseal{display:none}

/* =========================================================
   COVER
   ========================================================= */
.cover{
  position:relative;min-height:100vh;padding:34px clamp(24px,4.6vw,68px) 24px;
  background:
    radial-gradient(1000px 620px at 82% 10%,rgba(47,138,91,.12),transparent 62%),
    radial-gradient(900px 700px at 8% 100%,rgba(18,58,92,.42),transparent 68%),
    linear-gradient(160deg,#0A2338 0%,#0C2A43 52%,#071B2D 100%);
  color:#F0ECE1;overflow:hidden;display:flex;flex-direction:column;
}
.cover::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 9px);
  opacity:.35;
}
.hero-lines{position:absolute;inset:0;opacity:.055;pointer-events:none}
.hero-lines path,.hero-lines circle{stroke:#D8C7A4}
.cover-head{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:24px}
.cover-brand{width:300px;max-width:44vw;padding:0}
.cover-docket{
  text-align:right;font-family:var(--mono);font-size:9.5px;line-height:1.9;letter-spacing:.03em;
  color:rgba(240,236,225,.52);border-left:1px solid rgba(240,236,225,.15);padding-left:18px;
}
.cover-docket span{display:block;white-space:nowrap}
.cover-body{
  position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1.06fr) minmax(470px,.78fr);
  gap:clamp(28px,5vw,76px);align-items:center;flex:1;padding:44px 0 34px;
}
.cover-copy{max-width:660px}
.cover-kicker{display:flex;align-items:center;gap:11px;font-size:10.5px;letter-spacing:.14em;color:#C8B894}
.cover-kicker::before{content:"";width:24px;height:1px;background:#C8B894;opacity:.72}
.cover-title{font-family:var(--serif);font-weight:600;font-size:clamp(38px,4.6vw,58px);line-height:1.22;letter-spacing:.01em;margin:17px 0 0}
.cover-title em{font-style:normal;color:#D8C49A}
.cover-lead{font-size:14px;line-height:1.95;color:rgba(240,236,225,.72);margin-top:22px;max-width:570px}
.cover-lead strong{color:#F6F1E3;font-weight:500;border-bottom:1px solid rgba(200,183,148,.42);padding-bottom:1px}
.cover-facts{display:flex;flex-wrap:wrap;gap:0;margin-top:36px;border-top:1px solid rgba(240,236,225,.17);max-width:600px}
.cover-fact{padding:15px 26px 0 0;margin-right:26px;position:relative}
.cover-fact + .cover-fact::before{content:"";position:absolute;left:-26px;top:17px;bottom:4px;width:1px;background:rgba(240,236,225,.13)}
.cover-fact b{display:block;font-family:var(--serif);font-size:20px;color:#F2EBD9;font-weight:600;letter-spacing:.01em}
.cover-fact small{display:block;font-size:9.5px;letter-spacing:.08em;color:rgba(240,236,225,.44);margin-top:4px}

.cover-roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role-card{
  text-align:left;background:rgba(251,248,240,.035);border:1px solid rgba(240,236,225,.15);
  padding:17px 17px 14px;transition:background .18s ease,border-color .18s ease;position:relative;
}
.role-card:hover{background:rgba(251,248,240,.075);border-color:rgba(200,183,148,.4)}
.role-card .idx{
  display:flex;align-items:baseline;gap:8px;font-size:9.5px;letter-spacing:.1em;
  color:rgba(200,183,148,.9);font-family:var(--sans);
}
.role-card .idx span{font-family:var(--mono);font-size:9px;opacity:.6}
.role-card h3{font-family:var(--serif);font-weight:600;font-size:19px;margin:9px 0 6px;letter-spacing:.03em;color:#F4EFE2}
.role-card p{font-size:11px;line-height:1.7;color:rgba(240,236,225,.5);min-height:38px}
.role-card .go{
  display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:11px;
  border-top:1px solid rgba(240,236,225,.12);font-size:9.5px;letter-spacing:.06em;color:rgba(240,236,225,.56);
}
.role-card .go i{display:inline-block;width:16px;height:1px;background:#C8B894;position:relative;transition:width .18s ease}
.role-card .go i::after{content:"";position:absolute;right:0;top:-2px;width:5px;height:5px;border-top:1px solid #C8B894;border-right:1px solid #C8B894;transform:rotate(45deg)}
.role-card:hover .go i{width:26px}
.cover-mark{position:absolute;right:-64px;bottom:-70px;width:330px;opacity:.075;z-index:1;pointer-events:none}
.cover-foot{
  position:relative;z-index:2;display:flex;justify-content:space-between;gap:24px;
  border-top:1px solid rgba(240,236,225,.13);padding-top:15px;font-size:9.5px;
  letter-spacing:.03em;color:rgba(240,236,225,.36);
}
.cover-foot span{max-width:64%}

/* =========================================================
   SHELL
   ========================================================= */
.app-shell{position:relative;z-index:1}
.shell{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:100vh}
.rail{
  position:sticky;top:0;height:100vh;background:var(--navy-900);
  display:flex;flex-direction:column;color:rgba(240,236,225,.72);
  border-right:1px solid rgba(6,24,38,.5);z-index:10;
}
.rail::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 34%,rgba(6,24,38,.16));
}
.rail-brand{padding:22px 20px 18px;border-bottom:1px solid rgba(240,236,225,.1);position:relative;z-index:1}
.rail-brand-plate{width:206px;padding:0;background:none;border:0}
.rail-org{
  padding:13px 20px 5px;font-size:9.5px;letter-spacing:.05em;line-height:1.7;
  color:rgba(240,236,225,.5);position:relative;z-index:1;
}
.rail-org span{color:rgba(240,236,225,.32)}
.rail-nav{flex:1;overflow:auto;padding:8px 10px 18px;position:relative;z-index:1;scrollbar-width:thin}
.rail-group{font-size:9px;letter-spacing:.12em;color:rgba(200,183,148,.62);margin:18px 10px 6px}
.rail-item{
  display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;text-align:left;
  font-size:11.5px;color:rgba(240,236,225,.62);position:relative;transition:background .14s,color .14s;
  border-left:2px solid transparent;
}
.rail-item:hover{background:rgba(255,255,255,.045);color:#F2EDE0}
.rail-item.active{background:rgba(255,255,255,.055);color:#F6F1E4;border-left-color:var(--brand-l)}
.rail-item svg{width:14px;height:14px;opacity:.56;flex:0 0 auto}
.rail-item.active svg{opacity:.9}
.rail-item .tail{margin-left:auto;font-size:9.5px;color:rgba(240,236,225,.36)}
.rail-item.active .tail{color:var(--copper-l)}
.rail-foot{
  padding:12px 20px 18px;border-top:1px solid rgba(240,236,225,.1);
  font-size:9.5px;letter-spacing:.03em;color:rgba(240,236,225,.36);
  position:relative;z-index:1;line-height:1.8;
}
.rail-foot b{display:block;color:rgba(240,236,225,.62);font-weight:500;font-size:9.5px;letter-spacing:.06em}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:0 clamp(18px,2.8vw,34px);height:54px;flex:0 0 auto;
  background:rgba(251,248,240,.82);border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px);position:sticky;top:0;z-index:9;
}
.crumb{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.03em;color:var(--ink-3)}
.crumb b{font-weight:500;color:var(--ink);font-family:var(--serif);font-size:12px;letter-spacing:.03em}
.crumb span{opacity:.5}
.topbar-right{display:flex;align-items:center;gap:9px}
.demo-tag{display:inline-flex;align-items:center;gap:6px;font-size:9.5px;letter-spacing:.03em;color:var(--slate);border:1px solid var(--line);padding:4px 8px;background:rgba(251,248,240,.6)}
.demo-tag i{width:5px;height:5px;border-radius:50%;background:var(--brand)}
.role-pill{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.02em;color:var(--navy-800);background:var(--navy-100);border:1px solid #C9D9E4;padding:4px 9px}
.role-pill svg{width:11px;height:11px}
.switch-role{border:1px solid var(--line);background:transparent;color:var(--ink-2);font-size:10px;letter-spacing:.02em;padding:5px 9px;transition:.15s}
.switch-role:hover{border-color:var(--navy-700);color:var(--navy-800)}

/* =========================================================
   PAGE
   ========================================================= */
.page{padding:clamp(22px,2.6vw,34px) clamp(18px,2.8vw,34px) 46px;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin-bottom:22px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:9.5px;letter-spacing:.08em;color:var(--brand-d)}
.eyebrow::before{content:"";width:14px;height:1px;background:var(--brand);opacity:.7}
.page-title{font-family:var(--serif);font-size:29px;font-weight:600;letter-spacing:.01em;line-height:1.26;margin-top:7px}
.page-title .thin{font-weight:400;color:var(--ink-3);font-size:21px}
.page-sub{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.7;max-width:780px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}

/* =========================================================
   BUTTONS
   ========================================================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r);
  border:1px solid transparent;padding:7px 13px;font-size:11.5px;letter-spacing:.02em;
  transition:background .15s,border-color .15s,color .15s;white-space:nowrap;
}
.btn svg{width:12px;height:12px}
.btn-primary{background:var(--navy-800);color:#F7F2E4;border-color:var(--navy-900)}
.btn-primary:hover{background:var(--navy-700)}
.btn-gold{background:var(--copper);color:#fff;border-color:#8E6537}
.btn-gold:hover{background:#966B3B}
.btn-ghost{border-color:var(--line);background:rgba(251,248,240,.72);color:var(--ink-2)}
.btn-ghost:hover{border-color:#BFB39D;background:var(--paper-2);color:var(--navy-800)}
.btn-danger{border-color:#D9B3A8;background:var(--red-soft);color:var(--red)}
.btn-danger:hover{background:#F0D6CE}
.btn-text{border:none;background:none;color:var(--brand-d);font-size:10.5px;padding:3px 0;border-bottom:1px solid transparent}
.btn-text:hover{border-bottom-color:var(--brand-d)}
.btn-sm{padding:4px 9px;font-size:10.5px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.icon-btn{width:28px;height:28px;padding:0;border:1px solid var(--line);background:var(--paper-2);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2)}
.icon-btn:hover{border-color:var(--navy-700);color:var(--navy-800)}

/* =========================================================
   CARDS / GRIDS
   ========================================================= */
.card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-pad{padding:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 18px;border-bottom:1px solid var(--line-2)}
.card-head h3{font-family:var(--serif);font-size:14px;font-weight:600;letter-spacing:.02em}
.card-head .hint{font-size:9.5px;letter-spacing:.02em;color:var(--ink-3)}
.card-body{padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:13px}
.two-col{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(300px,.78fr);gap:15px}
.two-col-even{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:15px}
.three-col{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.four-col{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.section-title{display:flex;align-items:baseline;gap:9px;margin:24px 0 11px}
.section-title h2{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.02em}
.section-title small{font-size:9.5px;color:var(--ink-3);letter-spacing:.02em}
.hairline{height:1px;background:var(--line-2);margin:15px 0}

/* =========================================================
   KPI
   ========================================================= */
.kpis{display:grid;grid-template-columns:1.32fr repeat(4,minmax(0,1fr));gap:13px}
.kpi{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px 13px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.kpi.dark{background:var(--navy-900);color:#F2EDE0;border-color:var(--navy-950)}
.kpi.dark::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.035),transparent 42%);pointer-events:none}
.kpi-label{font-size:9.5px;letter-spacing:.04em;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.kpi.dark .kpi-label{color:rgba(242,237,224,.5)}
.kpi-value{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.2;margin-top:7px;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.kpi-value small{font-family:var(--sans);font-size:10.5px;font-weight:400;color:var(--ink-3);margin-left:4px}
.kpi.dark .kpi-value small{color:rgba(242,237,224,.5)}
.kpi-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:9.5px;color:var(--ink-3)}
.kpi.dark .kpi-foot{color:rgba(242,237,224,.44)}
.delta{font-size:9.5px;letter-spacing:.01em;color:var(--brand-d)}
.delta.down{color:var(--red)}
.kpi-spark{position:absolute;right:10px;bottom:9px;width:62px;height:24px;opacity:.42}

/* =========================================================
   TABLE
   ========================================================= */
.table{width:100%;border-collapse:collapse}
.table th{
  text-align:left;padding:9px 11px;font-size:9.5px;font-weight:500;letter-spacing:.04em;
  color:var(--ink-3);background:var(--paper-3);border-bottom:1px solid var(--line);
  white-space:nowrap;
}
.table td{padding:10px 11px;border-bottom:1px solid var(--line-2);font-size:11.5px;vertical-align:middle;color:var(--ink-2)}
.table tr:last-child td{border-bottom:none}
.table tbody tr{transition:background .12s ease;cursor:pointer}
.table tbody tr:hover{background:#F7F3E8}
.table .num{font-variant-numeric:tabular-nums}
.table .strong{color:var(--ink);font-weight:500}
.table .muted{color:var(--ink-3);font-size:10.5px}
.table-wrap{overflow:auto;scrollbar-width:thin}
.table-wrap .table{min-width:900px}
.rowcheck{width:13px;height:13px;accent-color:var(--brand-d);cursor:pointer;margin:0;vertical-align:-2px}

/* =========================================================
   PILL / METER / TABS
   ========================================================= */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;padding:2px 7px;border-radius:1px;border:1px solid;line-height:1.5;white-space:nowrap;letter-spacing:.01em}
.pill i{width:4px;height:4px;border-radius:50%;flex:0 0 auto}
.pill-green{color:var(--brand-d);background:var(--brand-050);border-color:#CBDCCF}.pill-green i{background:var(--brand)}
.pill-amber{color:var(--amber);background:var(--amber-soft);border-color:#E5D2AC}.pill-amber i{background:#B27E2C}
.pill-red{color:var(--red);background:var(--red-soft);border-color:#E4C3B8}.pill-red i{background:#A13C2E}
.pill-blue{color:var(--blue);background:var(--blue-soft);border-color:#C8DBE3}.pill-blue i{background:#2D5E7A}
.pill-gray{color:var(--slate);background:#ECE8DD;border-color:#DCD6C8}.pill-gray i{background:#7B8792}
.pill-gold{color:var(--copper);background:var(--copper-soft);border-color:#E1D0B2}.pill-gold i{background:var(--copper)}

.meter{height:3px;background:#E5DECF;position:relative;width:70px;display:inline-block;vertical-align:middle;overflow:hidden}
.meter > span{position:absolute;inset:0 auto 0 0;background:var(--brand);width:var(--w,60%)}
.meter.amber > span{background:#C08A32}
.meter.red > span{background:var(--red)}

.tabs{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line);overflow:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:none;background:transparent;padding:9px 14px;font-size:11.5px;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap;transition:.15s}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--navy-800);border-bottom-color:var(--brand);font-weight:500;background:linear-gradient(180deg,transparent,rgba(47,138,91,.05))}
.tab .cnt{font-size:9px;color:var(--ink-3);margin-left:3px}

/* =========================================================
   TODO / TAG
   ========================================================= */
.todo-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2);cursor:pointer;transition:.14s}
.todo-item:last-child{border-bottom:none}
.todo-item:hover{padding-left:4px;background:rgba(47,138,91,.03)}
.todo-rank{font-family:var(--mono);font-size:10px;color:var(--ink-3);width:18px;flex:0 0 auto}
.todo-main{flex:1;min-width:0}
.todo-main b{display:block;font-size:11.5px;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo-main > span{display:block;font-size:10px;color:var(--ink-3);margin-top:2px}
.todo-main .tag{display:inline-block;margin-top:4px}
.todo-right{text-align:right;flex:0 0 auto}
.todo-right .amt{font-family:var(--serif);font-size:13px;color:var(--ink);display:block}
.todo-right small{font-size:9px;color:var(--ink-3)}
.tag{display:inline-block;font-size:9px;letter-spacing:.02em;padding:1px 5px;border:1px solid var(--line);color:var(--ink-3);background:#F7F3E8;margin-left:4px;vertical-align:1px}
.tag.hot{color:var(--red);border-color:#E4C3B8;background:#FBF0EC}
.tag-demo{color:var(--brand-d);border-color:#CBDCCF;background:var(--brand-050)}

/* =========================================================
   CHARTS
   ========================================================= */
.barchart{display:flex;align-items:flex-end;gap:8px;height:118px;padding-top:8px}
.barchart .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.barchart .bar i{width:100%;max-width:20px;background:var(--navy-700);display:block;transition:height .5s cubic-bezier(.2,.7,.2,1);border-radius:1px 1px 0 0;position:relative}
.barchart .bar i.today{background:var(--brand)}
.barchart .bar span{font-size:8.5px;color:var(--ink-3);letter-spacing:.02em}
.barchart .bar b{font-size:9px;color:var(--ink-2);font-weight:500;font-variant-numeric:tabular-nums}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:56px 1fr 46px;align-items:center;gap:9px;font-size:10px;color:var(--ink-2)}
.hbar .track{height:5px;background:#E8E1D1;position:relative;border-radius:1px;overflow:hidden}
.hbar .track i{position:absolute;left:0;top:0;bottom:0;background:var(--navy-700)}
.hbar .track i.gold{background:var(--brand)}
.hbar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{width:100px;height:100px;position:relative;flex:0 0 auto}
.donut svg{width:100%;height:100%}
.donut b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);font-size:18px;color:var(--ink)}
.donut b small{font-family:var(--sans);font-size:8px;color:var(--ink-3);letter-spacing:.04em;margin-top:1px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:10px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:5px;height:5px;border-radius:50%}

/* =========================================================
   FLOW
   ========================================================= */
.flow{display:flex;align-items:flex-start;gap:0;margin:6px 0 2px}
.flow-step{flex:1;position:relative;text-align:center;min-width:0}
.flow-step::before{content:"";position:absolute;top:12px;left:50%;right:-50%;height:1px;background:var(--line);z-index:0}
.flow-step:last-child::before{display:none}
.flow-step.done::before,.flow-step.current::before{background:var(--brand)}
.flow-dot{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--paper-2);display:flex;align-items:center;justify-content:center;margin:0 auto;position:relative;z-index:1;font-family:var(--mono);font-size:9px;color:var(--ink-3)}
.flow-step.done .flow-dot{background:var(--navy-800);border-color:var(--navy-900);color:#F3EEDD}
.flow-step.current .flow-dot{border-color:var(--brand);color:var(--brand-d);background:var(--brand-050);box-shadow:0 0 0 3px rgba(47,138,91,.1)}
.flow-label{font-size:10px;color:var(--ink-3);margin-top:7px;letter-spacing:.01em}
.flow-step.done .flow-label,.flow-step.current .flow-label{color:var(--ink)}
.flow-time{font-size:8.5px;color:var(--ink-3);margin-top:2px;font-variant-numeric:tabular-nums}

/* =========================================================
   FIELD / SOURCE
   ========================================================= */
.field-group{margin-bottom:15px}
.field-group h4{font-family:var(--serif);font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--ink);display:flex;align-items:center;gap:8px;margin-bottom:5px}
.field-group h4::after{content:"";flex:1;height:1px;background:var(--line-2)}
.field-row{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px dotted #E6DFD0;font-size:11px}
.field-row:last-child{border-bottom:none}
.field-row .k{color:var(--ink-3);flex:0 0 auto}
.field-row .v{color:var(--ink);font-variant-numeric:tabular-nums;text-align:right;border-bottom:1px dashed rgba(47,138,91,.35);cursor:pointer;transition:.14s}
.field-row .v:hover{color:var(--brand-d);border-bottom-color:var(--brand)}
.field-row .v.warn{color:var(--red);border-bottom-color:rgba(161,60,46,.4)}
.source-card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow);position:sticky;top:72px}
.source-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.source-head h3{font-family:var(--serif);font-size:13px;font-weight:600}
.source-head .conf{font-size:9px;letter-spacing:.02em;color:var(--brand-d);border:1px solid #CBDCCF;background:var(--brand-050);padding:1px 5px}
.source-list{display:flex;flex-direction:column;gap:0}
.source-item{display:grid;grid-template-columns:66px 1fr;gap:9px;padding:7px 0;border-bottom:1px dotted #E6DFD0;font-size:10px;line-height:1.6}
.source-item:last-child{border-bottom:none}
.source-item label{color:var(--ink-3)}
.source-item span{color:var(--ink-2);word-break:break-all}
.evidence{margin-top:10px;border:1px dashed #D4C8AE;padding:8px;display:flex;align-items:center;gap:9px;background:#FAF6EA;cursor:pointer;transition:.16s}
.evidence:hover{border-color:var(--copper)}
.evidence .thumb{width:40px;height:30px;background:#E7EFE9;border:1px solid #C7D9CC;display:flex;align-items:center;justify-content:center;font-size:7.5px;color:var(--brand-d);letter-spacing:.04em;flex:0 0 auto}
.evidence small{display:block;font-size:8.5px;color:var(--ink-3);letter-spacing:.01em}
.evidence b{display:block;font-size:10px;font-weight:500;color:var(--ink-2)}

/* =========================================================
   LIMIT
   ========================================================= */
.formula{border:1px solid #D6CBB4;background:#FBF7EB;padding:14px 16px;position:relative;overflow:hidden;border-radius:var(--r)}
.formula::after{content:"计算口径 V1.3";position:absolute;right:11px;top:9px;font-size:8px;letter-spacing:.04em;color:#9B8054}
.formula .label{font-size:9px;letter-spacing:.04em;color:#826B40}
.formula .expr{font-family:var(--mono);font-size:11.5px;color:#3D3626;margin-top:7px;line-height:1.9;word-break:break-word}
.formula .expr b{color:var(--brand-d)}
.factor-row{display:grid;grid-template-columns:1.3fr .7fr 1fr 64px;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:11px}
.factor-row:last-child{border-bottom:none}
.factor-row .fname{color:var(--ink);font-weight:500}
.factor-row .fname small{display:block;font-weight:400;color:var(--ink-3);font-size:9px;margin-top:2px}
.factor-bar{height:4px;background:#E9E2D2;position:relative;overflow:hidden}
.factor-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--brand)}
.factor-row .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.factor-row .dir{text-align:center;font-size:9.5px;color:var(--brand-d)}
.factor-row .dir.neg{color:var(--red)}
.big-amount{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1.1;color:var(--navy-900);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.big-amount small{font-family:var(--sans);font-size:11px;color:var(--ink-3);margin-left:5px;font-weight:400}
.coef-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#FAF6EC;padding:4px 8px;font-size:10px;color:var(--ink-3);border-radius:var(--r);transition:.14s}
.chip.on{border-color:#B9D1C0;background:var(--brand-050);color:var(--brand-d);font-weight:500}
.chip:hover{border-color:var(--copper)}
.adjust-box{border:1px dashed #D4C8AE;background:#FAF6EA;padding:13px;margin-top:13px}
.adjust-box label{font-size:9.5px;letter-spacing:.03em;color:var(--ink-3);display:block;margin-bottom:5px}
.input{width:100%;border:1px solid var(--line);background:#FCFAF4;padding:7px 9px;font-size:11.5px;border-radius:var(--r);outline:none;transition:.15s}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 2px rgba(47,138,91,.1)}
textarea.input{resize:vertical;min-height:68px;line-height:1.7}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#7B8792 50%),linear-gradient(135deg,#7B8792 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 8px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:25px}
.inline-field{display:flex;align-items:center;gap:7px}
.inline-field .unit{font-size:9.5px;color:var(--ink-3);white-space:nowrap}
.field-label{font-size:9.5px;letter-spacing:.03em;color:var(--ink-3);display:block;margin-bottom:5px}

/* =========================================================
   REPORT / TIMELINE
   ========================================================= */
.report-doc{background:#FFFDF8;border:1px solid var(--line);padding:24px 28px;box-shadow:0 2px 14px -10px rgba(15,28,43,.35);font-family:var(--serif);line-height:2;font-size:12px;color:#26313A;position:relative}
.report-doc h3{font-size:16px;text-align:center;letter-spacing:.1em;margin-bottom:13px;font-weight:600}
.report-doc .meta{display:flex;justify-content:space-between;font-size:8.5px;letter-spacing:.02em;color:var(--ink-3);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:13px;font-family:var(--sans)}
.report-doc p{margin:0 0 8px;text-indent:2em}
.report-doc .cite{font-family:var(--sans);font-size:8.5px;background:var(--brand-050);color:var(--brand-d);border:1px solid #CBDCCF;padding:0 3px;margin:0 2px;letter-spacing:.01em;cursor:pointer;white-space:nowrap}
.report-doc .sec{font-family:var(--serif);font-weight:600;margin:13px 0 5px;font-size:12.5px;letter-spacing:.02em}
.timeline{position:relative;padding-left:21px}
.timeline::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--line)}
.event{position:relative;padding:0 0 17px}
.event::before{content:"";position:absolute;left:-21px;top:4px;width:9px;height:9px;border-radius:50%;border:1px solid #B6C6BC;background:var(--paper-2);z-index:1}
.event:first-child::before{background:var(--brand);border-color:var(--brand-d);box-shadow:0 0 0 3px rgba(47,138,91,.1)}
.event .etime{font-size:9px;color:var(--ink-3);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.event .etitle{font-size:11.5px;color:var(--ink);font-weight:500;margin-top:2px}
.event .etitle span{font-weight:400;color:var(--ink-3);font-size:10px;margin-left:7px}
.event .edesc{font-size:10px;color:var(--ink-3);line-height:1.7;margin-top:2px}

/* =========================================================
   CLIENT / PHONE
   ========================================================= */
.client-view{padding:clamp(20px,3vw,38px) clamp(18px,3.4vw,46px) 44px;display:grid;grid-template-columns:minmax(0,1fr) 404px;gap:clamp(24px,4vw,60px);align-items:start}
.journey-left{max-width:640px;padding-top:6px}
.journey-title{font-family:var(--serif);font-size:36px;line-height:1.3;letter-spacing:.01em;margin-top:9px}
.journey-title em{font-style:normal;color:var(--brand-d)}
.journey-lead{font-size:12px;color:var(--ink-3);line-height:1.9;margin-top:13px;max-width:540px}
.journey-steps{margin-top:26px;border-top:1px solid var(--line)}
.jstep{display:grid;grid-template-columns:36px 1fr auto;gap:13px;padding:15px 7px 15px 2px;border-bottom:1px solid var(--line-2);cursor:pointer;transition:.15s;position:relative;align-items:start}
.jstep:hover{background:rgba(251,248,240,.8);padding-left:7px}
.jstep.active{background:linear-gradient(90deg,rgba(47,138,91,.055),transparent 82%)}
.jstep.active::before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:2px;background:var(--brand)}
.jstep .jno{font-family:var(--mono);font-size:15px;color:#B9AE96;line-height:1.3}
.jstep.active .jno{color:var(--brand-d)}
.jstep h3{font-family:var(--serif);font-size:14.5px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:7px}
.jstep p{font-size:10px;color:var(--ink-3);line-height:1.7;margin-top:3px;max-width:420px}
.jstep .jt{font-size:9px;color:var(--ink-3);white-space:nowrap;letter-spacing:.02em;text-align:right}
.jstep .jt b{display:block;color:var(--brand-d);font-weight:500;font-size:10px}
.journey-note{margin-top:16px;display:flex;gap:8px;font-size:9.5px;color:var(--ink-3);line-height:1.7;border-left:2px solid var(--copper-l);padding-left:11px}
.phone-wrap{position:sticky;top:78px;display:flex;flex-direction:column;align-items:center;gap:10px}
.phone-caption{font-size:9px;color:var(--ink-3);letter-spacing:.02em}
.phone{
  width:392px;height:790px;background:#0A2338;border-radius:40px;padding:8px;
  box-shadow:0 34px 70px -38px rgba(6,24,38,.5),0 0 0 1px rgba(6,24,38,.5),inset 0 0 0 2px rgba(255,255,255,.05);
  position:relative;
}
.phone::after{content:"";position:absolute;left:-2px;top:146px;width:2px;height:48px;background:#163B57;border-radius:2px 0 0 2px}
.phone-screen{width:100%;height:100%;background:#FBF8F0;border-radius:33px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.m-status{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:9.5px;color:#26313A;font-variant-numeric:tabular-nums;flex:0 0 auto;position:relative}
.m-status .island{position:absolute;left:50%;transform:translateX(-50%);top:7px;width:82px;height:19px;background:#071B2D;border-radius:11px}
.m-status .right{display:flex;gap:5px;align-items:center}
.m-status .sig{display:flex;gap:2px;align-items:flex-end}
.m-status .sig i{width:2px;background:#26313A;display:block}
.m-apphead{padding:5px 18px 11px;display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
.m-brand{display:flex;align-items:center;gap:7px}
.m-brand b{font-family:var(--serif);font-size:12.5px;letter-spacing:.06em;font-weight:600}
.m-screen{flex:1;overflow:auto;padding:2px 18px 16px;scrollbar-width:none}
.m-screen::-webkit-scrollbar{display:none}
.m-tabs{flex:0 0 auto;height:56px;border-top:1px solid #E5DDCC;display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:9px;background:rgba(251,248,240,.97)}
.m-tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:8.5px;color:#8A938B;background:none;border:none}
.m-tabs button svg{width:15px;height:15px;opacity:.55}
.m-tabs button.on{color:var(--brand-d)}
.m-tabs button.on svg{opacity:1}
.m-hero{background:var(--navy-900);color:#F1ECDC;border-radius:3px;padding:15px;position:relative;overflow:hidden}
.m-hero::after{content:"";position:absolute;right:-24px;top:-30px;width:104px;height:104px;border:1px solid rgba(200,183,148,.18);border-radius:50%}
.m-hero .k{font-size:8.5px;letter-spacing:.06em;color:rgba(241,236,220,.5)}
.m-hero .v{font-family:var(--serif);font-size:28px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums}
.m-hero .v small{font-size:9.5px;font-family:var(--sans);color:rgba(241,236,220,.55);margin-left:3px}
.m-hero .foot{display:flex;justify-content:space-between;font-size:8.5px;color:rgba(241,236,220,.5);margin-top:9px;border-top:1px solid rgba(200,183,148,.14);padding-top:7px}
.m-label{font-size:8.5px;letter-spacing:.04em;color:#7B8792;margin:15px 0 7px;display:flex;align-items:center;justify-content:space-between}
.m-card{background:#FCFAF4;border:1px solid #E1D9C8;border-radius:var(--r);padding:12px}
.m-form-row{display:flex;align-items:center;justify-content:space-between;padding:9px 1px;border-bottom:1px solid #EDE6D6;font-size:10.5px}
.m-form-row label{color:#7B8792}
.m-form-row b{font-weight:500;color:#0F1C2B;font-variant-numeric:tabular-nums}
.m-input{border:1px solid #E1D9C8;background:#FCFAF4;width:100%;padding:8px 9px;font-size:10.5px;border-radius:var(--r);outline:none}
.m-btn{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;padding:10px;background:var(--navy-800);color:#F7F2E4;border:none;border-radius:var(--r);font-size:11px;letter-spacing:.03em;margin-top:12px}
.m-btn.ghost{background:transparent;border:1px solid #D6CCB7;color:#3E4B58}
.m-pill{display:inline-flex;align-items:center;gap:4px;font-size:8px;padding:2px 5px;border:1px solid #CBDCCF;background:var(--brand-050);color:var(--brand-d);border-radius:1px}
.m-progress{display:flex;gap:4px;margin-top:9px}
.m-progress i{height:2px;flex:1;background:#E4DCC9;border-radius:2px}
.m-progress i.on{background:var(--brand)}
.m-step-title{font-family:var(--serif);font-size:19px;line-height:1.35;letter-spacing:.01em;margin:5px 0 3px}
.m-step-sub{font-size:9px;color:#7B8792;line-height:1.6}
.m-photo{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}
.m-photo div{height:60px;border:1px dashed #D6CCB7;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:7.5px;color:#8A938B;background:#F8F4E9}
.m-photo div.done{border-style:solid;border-color:#C7D9CC;background:#EDF4EF;color:var(--brand-d)}
.m-timeline{position:relative;margin-top:4px}
.m-tl{display:flex;gap:9px;padding-bottom:13px;position:relative}
.m-tl .dot{width:13px;height:13px;border-radius:50%;border:1px solid #D1C5AB;background:#FCFAF4;flex:0 0 auto;position:relative;z-index:1;display:flex;align-items:center;justify-content:center}
.m-tl .dot.done{background:var(--navy-800);border-color:var(--navy-900);color:#F1ECDC;font-size:6.5px}
.m-tl .dot.cur{border-color:var(--brand);background:var(--brand-050)}
.m-tl::before{content:"";position:absolute;left:6px;top:13px;bottom:0;width:1px;background:#E1D9C8}
.m-tl:last-child::before{display:none}
.m-tl b{display:block;font-size:10px;color:#0F1C2B;font-weight:500}
.m-tl span{display:block;font-size:8px;color:#7B8792;margin-top:2px;line-height:1.6}
.m-tl .st{margin-left:auto;flex:0 0 auto;font-size:7.5px;color:var(--amber)}
.m-note{font-size:8px;line-height:1.7;color:#7E6126;background:var(--amber-soft);border-left:2px solid #C6A05C;padding:7px 8px;margin-top:9px}
.m-listitem{display:flex;align-items:center;justify-content:space-between;padding:8px 1px;border-bottom:1px solid #EDE6D6;font-size:10px}
.m-listitem:last-child{border-bottom:none}
.m-listitem b{font-weight:500}
.m-listitem small{display:block;font-size:8px;color:#8A938B;margin-top:2px}

/* =========================================================
   TEMPLATE EDITOR
   ========================================================= */
.tpl-card{transition:border-color .15s,background .15s}
.tpl-card:hover{border-color:#C6BBA4}
.tpl-card.selected{border-color:var(--brand);background:#F7FAF7;box-shadow:inset 0 0 0 1px rgba(47,138,91,.16)}
.tpl-name{font-family:var(--serif);font-size:15.5px;font-weight:600;margin-top:8px;letter-spacing:.01em;color:var(--ink)}
.template-list{display:flex;flex-direction:column;gap:2px}
.tpl{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:11px;border:1px solid transparent;border-bottom:1px solid var(--line-2);cursor:pointer;transition:.15s;background:transparent;text-align:left;width:100%}
.tpl:hover{background:#F7F3E8}
.tpl.active{background:var(--paper-2);border-color:var(--line);box-shadow:var(--shadow)}
.tpl .nm{font-family:var(--serif);font-size:12.5px;font-weight:600;letter-spacing:.02em}
.tpl .mt{font-size:9px;color:var(--ink-3);margin-top:3px;line-height:1.6}
.tpl .ver{font-size:8.5px;color:var(--copper);background:var(--copper-soft);border:1px solid #E1D0B2;padding:1px 4px;white-space:nowrap}
.editor-split{display:grid;grid-template-columns:minmax(0,1.06fr) minmax(360px,.94fr);gap:0;border-top:1px solid var(--line);min-height:620px}
.editor-form{padding:18px 20px;border-right:1px solid var(--line);overflow:auto;max-height:720px}
.editor-preview{background:#F4EFE3;padding:18px 20px;overflow:auto;max-height:720px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:9.5px;letter-spacing:.03em;color:var(--ink-3);margin-bottom:6px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.check{display:flex;align-items:center;gap:7px;padding:6px 8px;border:1px solid var(--line);background:#FAF6EC;font-size:10px;cursor:pointer;transition:.14s;border-radius:var(--r)}
.check:hover{border-color:var(--copper)}
.check.on{border-color:#C7D9CC;background:var(--brand-050);color:var(--brand-d)}
.check i{width:10px;height:10px;border:1px solid #C9C1AC;display:flex;align-items:center;justify-content:center;font-size:7px;flex:0 0 auto;background:#fff;font-style:normal}
.check.on i{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
.trial{background:var(--paper-2);border:1px solid var(--line);padding:13px;margin-bottom:10px;box-shadow:var(--shadow)}
.trial-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.trial-head b{font-family:var(--serif);font-size:11.5px;font-weight:600}
.trial-line{display:flex;justify-content:space-between;font-size:9.5px;padding:3px 0;color:var(--ink-3);font-variant-numeric:tabular-nums}
.trial-line strong{color:var(--ink-2);font-weight:500}
.trial-result{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.trial-result .amt{font-family:var(--serif);font-size:22px;color:var(--navy-900);font-weight:600;font-variant-numeric:tabular-nums}
.trial-result .flag{font-size:8.5px;padding:1px 5px;border:1px solid #CBDCCF;background:var(--brand-050);color:var(--brand-d)}
.rule-json{font-family:var(--mono);font-size:9.5px;line-height:1.8;background:var(--navy-900);color:#CCD9D2;padding:13px;border-radius:var(--r);overflow:auto;max-height:270px;margin-top:11px;white-space:pre}
.rule-json .k{color:var(--copper-l)}
.rule-json .s{color:#9BC8A9}

/* =========================================================
   MODAL / TOAST
   ========================================================= */
.modal-mask{position:fixed;inset:0;background:rgba(6,24,38,.48);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .16s ease}
.modal{background:var(--paper-2);border:1px solid #CFC3AB;box-shadow:0 30px 70px -30px rgba(6,24,38,.55);max-width:520px;width:100%;animation:rise .2s cubic-bezier(.2,.7,.2,1);position:relative;max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.modal-wide{max-width:660px}
.modal::before{content:"";position:absolute;inset:4px;border:1px solid rgba(169,123,69,.18);pointer-events:none}
.modal-head{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
.modal-head h3{font-family:var(--serif);font-size:16px;letter-spacing:.04em;font-weight:600}
.modal-body{padding:16px 20px;overflow:auto}
.modal-foot{padding:12px 20px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line-2);flex:0 0 auto}
.modal .close{border:none;background:none;color:var(--ink-3);font-size:17px;line-height:1;padding:3px}
.modal .close:hover{color:var(--ink)}
.modal-text{font-size:11px;color:var(--ink-2);line-height:1.9}
.modal-text b{color:var(--ink)}
.brief-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.brief-grid > div{display:flex;flex-direction:column;gap:3px;padding-bottom:9px;border-bottom:1px dotted #E4DDCE}
.brief-grid label{font-size:8.5px;letter-spacing:.03em;color:var(--ink-3)}
.brief-grid b{font-size:11.5px;font-weight:500;color:var(--ink)}
.warn-line{font-size:9.5px;color:#7E6126;background:var(--amber-soft);border-left:2px solid #C6A05C;padding:8px 10px;margin-top:11px;line-height:1.7}
.seal-stamp{position:absolute;right:24px;bottom:18px;width:88px;height:88px;border:2px solid rgba(161,60,46,.55);border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;color:rgba(161,60,46,.62);font-family:var(--serif);font-size:8px;line-height:1.35;letter-spacing:.06em;transform:rotate(-12deg);animation:stamp .4s cubic-bezier(.2,.9,.3,1.2);opacity:.9;pointer-events:none}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--navy-900);color:#F2ECDC;border:1px solid rgba(200,183,148,.32);padding:10px 16px;font-size:10.5px;letter-spacing:.02em;z-index:200;box-shadow:0 18px 40px -18px rgba(6,24,38,.55);display:flex;align-items:center;gap:8px;animation:rise .18s ease;max-width:calc(100vw - 40px)}
.toast i{width:5px;height:5px;border-radius:50%;background:var(--brand-l);flex:0 0 auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes stamp{from{opacity:0;transform:rotate(-12deg) scale(1.45)}to{opacity:.9;transform:rotate(-12deg) scale(1)}}

/* =========================================================
   DOC PREVIEW / MISC
   ========================================================= */
.doc-sheet{background:#FFFCF5;border:1px solid var(--line);padding:20px 22px;position:relative;font-family:var(--serif);font-size:10.5px;line-height:1.9;color:#2B353D;overflow:hidden}
.doc-watermark{position:absolute;right:-10px;top:34px;font-family:var(--sans);font-size:38px;font-weight:600;color:rgba(15,28,43,.05);transform:rotate(-16deg);pointer-events:none;letter-spacing:.06em}
.doc-head{display:flex;justify-content:space-between;font-size:8.5px;color:var(--ink-3);border-bottom:1px solid var(--line);padding-bottom:8px;font-family:var(--sans)}
.doc-sheet h2{font-size:15px;margin:13px 0 5px;letter-spacing:.04em}
.doc-meta{font-size:8.5px;color:var(--ink-3);font-family:var(--sans)}
.doc-rule{height:1px;background:var(--line);margin:11px 0}
.doc-lines{display:flex;flex-direction:column;gap:7px;margin-top:13px}
.doc-lines i{display:block;height:1px;background:#E8E0CE;width:100%}
.doc-sign{margin-top:16px;font-size:8.5px;color:var(--ink-3);font-family:var(--sans);line-height:1.8}
.doc-list{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.doc{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#FAF6EC;padding:8px 9px;font-size:10px;cursor:pointer;transition:.14s}
.doc:hover{border-color:var(--copper);background:var(--paper-2)}
.doc .ic{width:22px;height:26px;border:1px solid #D4C9B1;background:var(--copper-soft);display:flex;align-items:center;justify-content:center;font-size:6.5px;color:#826B40;letter-spacing:.03em;flex:0 0 auto}
.doc small{display:block;color:var(--ink-3);font-size:8px;margin-top:1px}
.note-mini{font-size:9px;color:var(--ink-3);line-height:1.7}
.check-list{display:flex;flex-direction:column;gap:0}
.check-row{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px dotted #E6DFD0;font-size:10.5px;line-height:1.7}
.check-row:last-child{border-bottom:none}
.check-row .ok{width:13px;height:13px;border-radius:50%;background:var(--brand-050);border:1px solid #CBDCCF;color:var(--brand-d);display:flex;align-items:center;justify-content:center;font-size:7px;flex:0 0 auto;margin-top:2px}
.check-row .warnmark{background:var(--amber-soft);border-color:#E5D2AC;color:var(--amber)}
.check-row .bad{background:var(--red-soft);border-color:#E4C3B8;color:var(--red)}
.check-row b{font-weight:500;color:var(--ink-2)}
.check-row span{color:var(--ink-3);font-size:9.5px}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width:1280px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .kpi:first-child{grid-column:span 1}
  .factor-row{grid-template-columns:1.2fr .6fr .9fr 50px}
  .cover-body{grid-template-columns:minmax(0,1fr) minmax(420px,.78fr);gap:40px}
}
@media (max-width:1100px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;padding:0 10px;min-height:56px}
  .rail-brand{padding:8px 12px;border:none;border-right:1px solid rgba(240,236,225,.1);width:176px;flex:0 0 auto}
  .rail-brand-plate{padding:6px 8px}
  .rail-org,.rail-foot{display:none}
  .rail-nav{display:flex;flex-wrap:wrap;gap:1px;padding:5px}
  .rail-group{display:none}
  .rail-item{padding:7px 9px;width:auto;font-size:10.5px}
  .rail-item .tail{display:none}
  .client-view{grid-template-columns:1fr;justify-items:center}
  .journey-left{max-width:100%}
  .phone-wrap{position:static;margin-top:20px}
  .two-col,.two-col-even{grid-template-columns:1fr}
  .four-col{grid-template-columns:repeat(2,1fr)}
  .editor-split{grid-template-columns:1fr}
  .editor-form{border-right:none;border-bottom:1px solid var(--line);max-height:none}
  .editor-preview{max-height:none}
  .cover-body{grid-template-columns:1fr;padding-top:30px}
  .cover-roles{grid-template-columns:1fr 1fr}
}
@media (max-width:720px){
  body{overflow-x:hidden}
  .page-title{font-size:23px}
  .page-title .thin{font-size:18px}
  .kpis{grid-template-columns:1fr 1fr}
  .three-col{grid-template-columns:1fr}
  .cover{padding:24px 18px}
  .cover-head{align-items:flex-start;flex-direction:column;gap:14px}
  .cover-brand{width:230px;max-width:100%}
  .cover-docket{text-align:left;border-left:none;padding-left:0}
  .cover-title{font-size:32px}
  .cover-roles{grid-template-columns:1fr}
  .cover-facts{flex-wrap:wrap}
  .cover-foot{flex-direction:column;font-size:9px}
  .cover-foot span{max-width:100%}
  .cover-mark{display:none}
  .topbar{position:static;height:auto;padding:8px 14px;flex-wrap:wrap;align-items:flex-start;gap:6px}
  .crumb{flex:1 1 100%;font-size:9.5px}
  .rail{display:flex;flex-direction:column;align-items:stretch;padding:0 12px 6px}
  .rail-brand{width:172px;padding:9px 0 7px;border-right:none;border-bottom:none}
  .rail-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:0 0 4px}
  .rail-item{justify-content:center;padding:7px 4px;font-size:9.5px}
  .rail-item svg{display:none}
  .rail-item .tail{display:none}
  .topbar-right{flex-wrap:wrap;gap:6px}
  .demo-tag{display:none}
  .role-pill,.switch-role{font-size:9.5px;padding:4px 7px}
  .client-view{padding:18px 16px 30px;grid-template-columns:minmax(0,1fr);justify-items:stretch;gap:24px}
  .journey-left{width:100%;min-width:0;max-width:100%}
  .journey-title{font-size:29px}
  .journey-lead{font-size:11px}
  .journey-steps{overflow:hidden}
  .jstep{grid-template-columns:28px minmax(0,1fr);gap:10px}
  .jstep .jt{display:none}
  .jstep h3{font-size:13.5px}
  .phone-wrap{width:100%}
  .phone{width:min(340px,100%);height:680px}
  .page-head{flex-direction:column;align-items:flex-start}
  .page-actions{width:100%}
  .factor-row{grid-template-columns:1fr;gap:3px}
  .factor-row .val{text-align:left}
  .brief-grid{grid-template-columns:1fr}
  .doc-list{grid-template-columns:1fr}
  .modal{max-height:calc(100vh - 24px)}
  .modal-mask{padding:12px}
  .two-col,.two-col-even{grid-template-columns:1fr}
  .three-col{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

  function ruleJsonData(){
    const t = S.tpl;
    return {
      template: t.name, version: t.ver, industry: t.industry,
      formula: { type:"min", items:[`sales*${t.rate}`, `area*${t.perMu}*${t.coef}`, t.cap] },
      params: { salesAvg:t.sales, area:t.area, perMuCost:t.perMu, coefficient:t.coef, salesRate:t.rate, cap:t.cap },
      vetoes: t.vetoes.filter(v=>t.veto[v.key]).map(v=>v.key),
      alerts: t.warns.filter(w=>t.warn[w.key]).map(w=>w.key)
    };
  }

  function ruleJson(){
    const t = S.tpl;
    const body = esc(JSON.stringify(ruleJsonData(), null, 2))
      .replace(/(&quot;[^&]+&quot;):/g, '<span class="k">$1</span>:');
    return `<span class="k">// ${esc(t.industry)}模板 · 规则包（节选）</span>\n${body}`;
  }

  function toast(msg){
    S.toast = msg;
    render();
    clearTimeout(S.toastTimer);
    S.toastTimer = setTimeout(()=>{ S.toast = null; render(); }, 2600);
  }

  function download(name, content, mime="text/plain;charset=utf-8"){
    const blob = new Blob([content], { type:mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1200);
  }

  function csv(rows){
    return rows.map(r=>r.map(c=>`"${String(c==null?"":c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  }

  function syncGReview(){
    const amt = parseFloat(document.getElementById("gAmt")?.value);
    const rate = parseFloat(document.getElementById("gRate")?.value);
    const opinion = document.getElementById("gOpinion")?.value;
    if(!isNaN(amt)) S.gReview.amount = amt;
    if(!isNaN(rate)) S.gReview.rate = rate;
    if(typeof opinion === "string") S.gReview.opinion = opinion;
  }

  function syncHash(){
    const hash = S.role
      ? "#" + (S.view==="bank-detail" ? `bank/bank-detail/${S.tab}` : `${S.role}/${S.view}`)
      : "";
    try{ history.replaceState(null, "", location.pathname + location.search + hash); }catch(e){}
  }

  /* ---------- RENDER ---------- */
  function render(){
    syncHash();
    const app = document.getElementById("app");
    if(!S.role){ app.innerHTML = renderCover() + (S.toast?`<div class="toast"><i></i>${esc(S.toast)}</div>`:""); return; }
    if(S.role==="client"){
      app.innerHTML = `<div class="shell" style="grid-template-columns:1fr">
        <main class="main">
          <header class="topbar">
            <div class="crumb"><span>兴农联担</span><span>/</span><b>客户 H5</b><span>/</span><span>五步旅程</span></div>
            <div class="topbar-right"><span class="demo-tag"><i></i>${esc(D.meta.env)}</span><span class="role-pill">${icon("user")}客户</span><button class="switch-role" data-action="switch-role">切换角色</button></div>
          </header>
          ${clientJourney()}
        </main>
      </div>` + (S.toast?`<div class="toast"><i></i>${esc(S.toast)}</div>`:"") + renderModal();
      return;
    }
    const page = {
      "bank-home":bankHome, "bank-pool":bankPool, "bank-detail":bankDetail,
      "g-home":gHome, "g-review":gReview,
      "admin-tpl":adminTpl, "admin-rules":adminRules, "admin-source":adminSource, "admin-audit":adminAudit
    }[S.view] || bankHome;
    app.innerHTML = renderShell(page()) + (S.toast?`<div class="toast"><i></i>${esc(S.toast)}</div>`:"") + renderModal();
  }

  /* ---------- 事件 ---------- */
  document.addEventListener("click", e => {
    if(e.target.matches("[data-check]")){
      const v = e.target.dataset.check;
      if(v==="all"){
        const list = D.apps.filter(a => a.no!=="NX2026120007" && (S.poolIndustry==="全部" || a.industry===S.poolIndustry)
          && (!S.poolQuery || (a.subject+a.no+a.owner).includes(S.poolQuery)));
        S.selected = e.target.checked ? list.map(a=>a.no) : [];
      } else {
        S.selected = e.target.checked ? [...new Set([...S.selected, v])] : S.selected.filter(x=>x!==v);
      }
      render(); return;
    }
    const el = e.target.closest("[data-role],[data-nav],[data-app],[data-tab],[data-field],[data-jstep],[data-action],[data-cite],[data-veto],[data-warn],[data-doc],[data-ticket]");
    if(!el) return;

    if(el.dataset.role){
      S.role = el.dataset.role;
      S.view = { client:"client", bank:"bank-home", guarantee:"g-home", admin:"admin-tpl" }[S.role];
      S.tab = "overview"; S.modal = null; render(); return;
    }
    if(el.dataset.nav){
      S.view = el.dataset.nav;
      if(S.view==="bank-detail"){ S.tab = "overview"; S.appNo="NX2026120007"; }
      S.modal = null; render(); return;
    }
    if(el.dataset.app){
      const no = el.dataset.app;
      if(no==="NX2026120007"){
        S.role = "bank"; S.view = "bank-detail"; S.tab = "overview"; S.appNo=no; S.modal=null; render();
      } else {
        S.modal = { type:"appBrief", no }; render();
      }
      return;
    }
    if(el.dataset.tab){ S.tab = el.dataset.tab; render(); return; }
    if(el.dataset.field){ S.field = el.dataset.field; render(); return; }
    if(el.dataset.jstep!==undefined){ S.jstep = parseInt(el.dataset.jstep); render(); return; }
    if(el.dataset.doc){
      S.modal = { type:"doc", title:el.dataset.doc, note:el.dataset.note || "材料归档" }; render(); return;
    }
    if(el.dataset.ticket){
      S.modal = { type:"ticket", no:el.dataset.ticket }; render(); return;
    }
    if(el.dataset.cite){
      const cite = el.dataset.cite;
      const fieldMap = { "F-01":"遥感核验面积","F-02":"NDVI 近 12 月均值","F-03":"灾情图斑","F-04":"近三年销售收入","F-07":"近 12 月回款流水","F-09":"投保面积" };
      if(fieldMap[cite]){ S.tab="profile"; S.field=fieldMap[cite]; toast("引用 "+cite+" → 已定位到画像字段与来源卡"); }
      else { S.tab="limit"; toast("引用 "+cite+" → 已定位到额度测算公式与系数"); }
      return;
    }
    if(el.dataset.veto){
      const k = el.dataset.veto; S.tpl.veto[k] = !S.tpl.veto[k];
      el.classList.toggle("on", S.tpl.veto[k]);
      el.querySelector("i").textContent = S.tpl.veto[k] ? "✓" : "";
      refreshTrial(); return;
    }
    if(el.dataset.warn){
      const k = el.dataset.warn; S.tpl.warn[k] = !S.tpl.warn[k];
      el.classList.toggle("on", S.tpl.warn[k]);
      el.querySelector("i").textContent = S.tpl.warn[k] ? "✓" : "";
      return;
    }

    const a = el.dataset.action;
    switch(a){
      case "switch-role":
        S.role = null; S.view = "cover"; S.modal = null; render(); break;
      case "toast":
        toast(el.dataset.msg || "演示操作"); break;
      case "jnext":
        if(S.jstep < 4) S.jstep++; render(); break;
      case "jreset":
        S.jstep = 0; render(); break;
      case "filter-industry":
        S.poolIndustry = el.dataset.ind; render(); break;
      case "reset-pool":
        S.poolIndustry = "全部"; S.poolQuery = ""; render(); break;
      case "search": {
        const q = document.getElementById("poolSearch");
        S.poolQuery = q ? q.value.trim() : ""; render(); break;
      }
      case "toggle-coef":
        S.coefOn[el.dataset.key] = !S.coefOn[el.dataset.key];
        S.adjust = null; render(); break;
      case "adjust": {
        const amt = parseFloat(document.getElementById("adjAmt")?.value || "0");
        const reason = (document.getElementById("adjReason")?.value || "").trim();
        const base = limitCalc().suggest;
        if(!amt || !reason){ toast("请填写调整额度与理由"); break; }
        S.adjust = { amount: amt, reason, delta: (amt-base)/base*100, over20: Math.abs((amt-base)/base) > 0.2 };
        toast(S.adjust.over20 ? "已留痕，并进入复核队列" : "调整已留痕，原测算值保留");
        break;
      }
      case "approve":
        if(["S09","S06"].includes(D.detail.stateCode)){ toast("当前状态为 "+D.detail.stateCode+"，不可重复审批"); break; }
        S.modal = { type:"approve" }; render(); break;
      case "reject":
        if(["S09","S06"].includes(D.detail.stateCode)){ toast("当前状态为 "+D.detail.stateCode+"，不可退回"); break; }
        S.modal = { type:"reject" }; render(); break;
      case "letter":
        syncGReview();
        if(S.gReview.choice==="decline"){ toast("当前结论为不建议担保，不能出具担保函"); break; }
        S.modal = { type:"letter" }; render(); break;
      case "publish":
        S.modal = { type:"publish" }; render(); break;
      case "rollback":
        S.modal = { type:"rollback" }; render(); break;
      case "select-tpl": {
        const idx = parseInt(el.dataset.idx);
        if(!Number.isNaN(idx) && S.tpls[idx]){
          S.tplIdx = idx; S.tpl = S.tpls[idx]; render();
        }
        break;
      }
      case "duplicate-tpl": {
        const src = clone(S.tpl);
        src.name = src.name.replace(/ · .*$/, "") + " · 副本";
        src.ver = src.ver.split(" · ")[0] + " · 配置中";
        src.status = "配置中";
        S.tpls.push(src);
        D.admin.templateConfigs.push(clone(src));
        D.admin.templates.push({ industry: src.industry, name: src.name, meta: "草案 · 待校验", ver: src.ver.split(" · ")[0], status: "配置中" });
        S.tplIdx = S.tpls.length-1;
        S.tpl = S.tpls[S.tplIdx];
        toast("已复制为「"+src.name+"」，修改后需重新试算");
        break;
      }
      case "save-draft":
        toast("草稿已保存，未影响在途单据");
        break;
      case "save-gray": {
        const g = document.getElementById("grayRange");
        S.gray = g ? parseInt(g.value) : S.gray;
        const v = D.admin.versions.find(x=>x.ver==="v1.4");
        if(v){ v.gray = S.gray+"%"; v.status = "灰度观察"; }
        toast("灰度比例已更新为 "+S.gray+"%，无需发版");
        break;
      }
      case "new-change":
        S.modal = { type:"newChange" }; render(); break;
      case "create-change": {
        const title = (document.getElementById("chTitle")?.value||"").trim();
        const scope = (document.getElementById("chScope")?.value||"").trim();
        if(!title){ toast("请填写变更标题"); break; }
        if(!D.admin.changes) D.admin.changes = [];
        D.admin.changes.unshift({ id: "CHG-2026-0"+(D.admin.changes.length+1), title, scope, owner: "项目组", date: "2026-11-20", state: "待三方确认" });
        S.modal = null; toast("变更单已提交，待项目负责人、风控、农担三方确认");
        break;
      }
      case "compare":
        S.modal = { type:"compare", ver: el.dataset.ver }; render(); break;
      case "export-compare":
        download("规则版本差异_"+((S.modal&&S.modal.ver)||"v1.4")+".txt", ["兴农联担 · 规则版本差异", "对比对象："+((S.modal&&S.modal.ver)||"v1.4")+" vs v1.3", "", "销售收入系数 0.56 / 0.56 · 无变化", "综合系数上限 1.20 / 1.20 · 无变化", "政策上限 300 万 / 300 万 · 无变化", "订单覆盖率准入 ≥50% / ≥55% · 收紧 5pct", "NDVI 预警阈值 15% / 12% · 预警更早"].join("\n"));
        toast("差异报告已导出"); break;
      case "filter-audit":
        S.auditFilter = el.dataset.type; render(); break;
      case "audit-search": {
        S.auditQuery = (document.getElementById("auditSearch")?.value||"").trim();
        S.auditDate = document.getElementById("auditDate")?.value || "";
        render(); break;
      }
      case "audit-reset":
        S.auditFilter = "全部"; S.auditQuery = ""; S.auditDate = ""; render(); break;
      case "export-audit":
        S.modal = { type:"auditExport" }; render(); break;
      case "confirm-audit-export": {
        const rows = D.admin.audits.map(a=>[a.time,a.actor,a.action,a.object,a.ip,a.result,a.level]);
        download("兴农联担_审计日志_20261120.csv", "\uFEFF"+csv([["时间","操作人","动作","对象","IP","结果","数据级别"],...rows]));
        S.modal = null; toast("审计日志已导出，本次导出已写入日志");
        break;
      }
      case "export-bank": {
        download("兴农联担_银行经营日报_20261120.csv", "\uFEFF"+csv([
          ["指标","数值"],["今日新增进件","7 笔"],["待处理任务","12 笔"],["在途授信金额","1,286 万元"],["平均完整度","82.6%"],["平均审批耗时","1.8 天"]
        ]));
        toast("经营日报已导出 CSV");
        break;
      }
      case "export-pool": {
        const list = D.apps.filter(a => (S.poolIndustry==="全部" || a.industry===S.poolIndustry) && (!S.poolQuery || (a.subject+a.no+a.owner).includes(S.poolQuery)));
        download("兴农联担_进件池_20261120.csv", "\uFEFF"+csv([
          ["业务编号","主体","产业","面积","申请金额","建议额度","完整度","状态","客户经理","更新时间"],
          ...list.map(a=>[a.no,a.subject,a.industry,a.area,a.appAmt,a.suggest,a.completeness,a.state,a.manager,a.time])
        ]));
        toast("已导出 "+list.length+" 条进件");
        break;
      }
      case "claim-selected": {
        if(!S.selected.length){ toast("请先勾选要认领的进件"); break; }
        let n = 0;
        D.apps.forEach(a=>{ if(S.selected.includes(a.no) && a.no!=="NX2026120007"){ a.manager = "陈旻"; a.state = "已认领"; a.stateCode="S03"; n++; } });
        S.selected = [];
        toast("已认领 "+n+" 笔进件，任务已进入我的待办");
        break;
      }
      case "new-app":
        S.modal = { type:"newApp" }; render(); break;
      case "create-app": {
        const subject = (document.getElementById("newSubject")?.value||"").trim();
        const industry = document.getElementById("newIndustry")?.value || "脐橙";
        const area = parseFloat(document.getElementById("newArea")?.value||"0");
        const amt = parseFloat(document.getElementById("newAmt")?.value||"0");
        if(!subject){ toast("请填写申请主体"); break; }
        if(!(amt>0)){ toast("申请金额需大于 0"); break; }
        const no = "NX2026" + (120000 + D.apps.length + 1);
        const app = { no, subject, owner:"待补联系人", industry, area: area||0, appAmt: amt, suggest: 0, completeness: 12, state: "待受理", stateCode: "S01", tone: "gray", manager: "陈旻", updated: "11-20 11:05", term:36, risk:"—", flags:["新建进件"] };
        D.apps.unshift(app);
        S.modal = null; S.view = "bank-pool"; S.poolIndustry = "全部"; S.poolQuery = ""; S.appNo = no;
        toast("进件 "+no+" 已创建 · S01 待受理，材料清单已生成");
        break;
      }
      case "print-page":
        toast("已调起浏览器打印，可按机构模板另存 PDF");
        setTimeout(()=>{ try{ window.print(); }catch(err){} }, 120);
        break;
      case "export-report": {
        const d = D.detail;
        download("NX2026120007_尽调报告.txt", [
          "兴农联担 · 授信尽调报告（节选）",
          "业务编号："+d.no,"申请主体："+d.subject,"经营产业："+d.industry+" / "+d.area+" 亩",
          "申请金额："+d.appAmt+" 万元","建议额度："+d.suggest+" 万元","数据完整度："+d.completeness+"%",
          "状态："+d.stateCode+" "+d.state,"客户经理："+d.manager,
          "", "报告各段引用均已绑定结构化字段；导出含查询水印与业务编号。"
        ].join("\n"));
        toast("报告已导出，含查询水印与业务编号");
        break;
      }
      case "regen-report":
        D.detail.reportTime = "2026-11-20 11:06";
        toast("报告已重新生成，12 处引用全部绑定字段");
        break;
      case "export-review": {
        const t = D.guarantee.reviewTarget;
        download("NX2026120003_担保评审材料.txt", [
          "兴农联担 · 担保评审材料", "业务编号："+t.no,"主体："+t.subject,"申请："+t.appAmt+" 万元","建议："+t.suggest+" 万元",
          "评审结论："+(S.gReview.choice==="pass"?"建议通过":S.gReview.choice==="conditional"?"附条件通过":"不建议担保"),
          "意见："+S.gReview.opinion
        ].join("\n"));
        toast("评审材料已导出");
        break;
      }
      case "export-guarantee": {
        download("兴农联担_保后台账_20261120.csv", "\uFEFF"+csv([
          ["工单号","主体","预警等级","信号","响应时限"],
          ...D.guarantee.postloan.map(p=>[p.no,p.name,p.level,p.alert,p.deadline])
        ]));
        toast("保后台账已导出");
        break;
      }
      case "resolve-ticket": {
        const no = el.dataset.no;
        const idx = D.guarantee.postloan.findIndex(x=>x.no===no);
        if(idx>=0){ D.guarantee.postloan.splice(idx,1); }
        S.modal = null; toast(no+" 已标记核查，处置记录写入保后台账");
        break;
      }
      case "open-detail":
        S.view = "bank-detail"; S.tab = "overview"; S.modal = null; render(); break;
      case "open-main":
        S.view = "bank-detail"; S.tab = "overview"; S.appNo = "NX2026120007"; S.modal = null; render(); break;
      case "download-doc": {
        download((S.modal.title||"材料")+".txt", ["兴农联担 · 材料归档","业务编号：NX2026120007","材料："+(S.modal.title||""),"说明："+(S.modal.note||""),"","本副本为演示占位，真实文件需按权限与水印规则导出。"].join("\n"));
        toast("材料副本已导出");
        break;
      }
      case "review-choice":
        syncGReview();
        S.gReview.choice = el.dataset.choice;
        render(); break;
      case "toggle-collateral": {
        syncGReview();
        const k = el.dataset.key; S.gReview.collateral[k] = !S.gReview.collateral[k];
        render(); break;
      }
      case "save-opinion":
        syncGReview();
        toast("评审意见已暂存，未出具担保函");
        break;
      case "source-log":
        S.modal = { type:"sourceLog", source: D.admin.sources.find(s=>s.name===el.dataset.source) || D.admin.sources[0] }; render(); break;
      case "download-source": {
        download("数据源调用日志.txt", ["兴农联担 · 数据源调用留痕","数据源："+(S.modal.source?.name||""),"近 7 日成功率："+(S.modal.source?.success||""),"","11-20 10:31 NX2026120007 · 画像核验 182ms 成功","11-20 09:58 NX2026120009 · 冲突复核 201ms 成功","11-20 09:31 批量预授信 · 12 笔 1.4s 1 笔超时重试"].join("\n"));
        toast("调用日志已导出");
        break;
      }
      case "add-source":
        S.modal = { type:"addSource" }; render(); break;
      case "create-source": {
        const name = (document.getElementById("srcName")?.value||"").trim();
        const type = document.getElementById("srcType")?.value || "政府接口";
        if(!name){ toast("请填写数据源名称"); break; }
        D.admin.sources.push({ name, type, status: "待启用", sla: "99.2%", success: "—", note: "新登记 · 待补齐合规三件套" });
        S.modal = null; toast("数据源已登记，补齐合规三件套后可启用");
        break;
      }
      case "export-quality": {
        download("数据质量报告_20261120.csv", "\uFEFF"+csv([
          ["数据源","接入方式","SLA","近 7 日成功率","状态"],
          ...D.admin.sources.map(s=>[s.name,s.type,s.sla,s.success,s.status])
        ]));
        toast("质量报告已导出");
        break;
      }
      case "close-modal":
        S.modal = null; render(); break;
      case "confirm-approve": {
        if(["S09","S06"].includes(D.detail.stateCode)){ S.modal=null; toast("状态已变化，操作被拒绝"); break; }
        const d = D.detail;
        d.state = "银行审批通过"; d.stateCode = "S09";
        const app = D.apps.find(x=>x.no==="NX2026120007");
        if(app){ app.state = "银行审批通过"; app.stateCode = "S09"; app.tone = "green"; }
        S.modal = null;
        toast("审批已通过 · S09，事件已留痕");
        break;
      }
      case "confirm-reject": {
        if(["S09","S06"].includes(D.detail.stateCode)){ S.modal=null; toast("状态已变化，操作被拒绝"); break; }
        const d = D.detail;
        d.state = "待补材料"; d.stateCode = "S06";
        const app = D.apps.find(x=>x.no==="NX2026120007");
        if(app){ app.state = "待补材料"; app.stateCode = "S06"; app.tone = "amber"; app.manager = "陈旻"; }
        S.modal = null;
        toast("已退回补件 · S06，一次告知清单已发送");
        break;
      }
      case "confirm-letter": {
        const no = "NXD-2026-" + String(87 + (S.gReview.letterNo?1:0)).padStart(4,"0");
        if(S.gReview.letterNo){ S.modal=null; toast("担保函已出具，请勿重复操作"); break; }
        S.gReview.letterNo = no;
        D.guarantee.reviewTarget.status = "担保函已出具";
        S.modal = null;
        toast("担保函 "+no+" 已出具，回执已归档");
        break;
      }
      case "confirm-publish": {
        const t = S.tpl;
        const ver = t.ver.split(" · ")[0];
        t.status = "生效中";
        const tp = D.admin.templates[S.tplIdx];
        if(tp){ tp.status = "生效中"; tp.ver = ver; }
        const gray = parseInt(document.getElementById("publishGray")?.value || "20");
        D.admin.versions.push({ ver, scene: t.industry+" · 灰度", scope: t.scope, gray: gray+"%", status: "灰度观察", date: "2026-11-20", by: "风控建模 · 徐岚" });
        S.modal = null;
        toast(ver+" 已发布，灰度 "+gray+"%，在途单据继续使用提交时快照");
        break;
      }
      case "confirm-rollback": {
        const v = D.admin.versions.find(x=>x.ver==="v1.4");
        if(v){ v.status = "已回滚"; }
        S.modal = null;
        toast("已回滚至 v1.3，记录写入审计日志");
        break;
      }
      default:
        toast("该操作暂未定义");
    }
  });

  document.addEventListener("keydown", e => {
    if(e.key==="Enter" && e.target.id==="poolSearch"){
      S.poolQuery = e.target.value.trim(); render();
    }
    if(e.key==="Enter" && e.target.id==="auditSearch"){
      S.auditQuery = e.target.value.trim();
      S.auditDate = document.getElementById("auditDate")?.value || "";
      render();
    }
  });

  document.addEventListener("click", e => {
    if(e.target.classList.contains("modal-mask")){ S.modal = null; render(); }
  });

  document.addEventListener("input", e => {
    if(e.target.id==="grayRange"){
      S.gray = parseInt(e.target.value);
      const v = document.getElementById("grayVal");
      if(v) v.textContent = S.gray + "%";
      return;
    }
    if(e.target.dataset.gfield){
      if(e.target.dataset.gfield==="amount"){
        const n = parseFloat(e.target.value);
        if(!isNaN(n)) S.gReview.amount = n;
        const la = document.getElementById("letterAmt");
        if(la) la.textContent = nf(S.gReview.amount);
      }
      if(e.target.dataset.gfield==="rate"){
        const n = parseFloat(e.target.value);
        if(!isNaN(n)) S.gReview.rate = n;
      }
      if(e.target.dataset.gfield==="opinion") S.gReview.opinion = e.target.value;
      return;
    }
    if(e.target.dataset.liveText){
      S.tpl[e.target.dataset.liveText] = e.target.value;
      return;
    }
    const key = e.target.dataset.live;
    if(key){
      const v = parseFloat(e.target.value);
      if(!isNaN(v)){ S.tpl[key] = v; refreshTrial(); }
    }
  });

  function refreshTrial(){
    const list = document.getElementById("trial-list");
    if(!list) return;
    const t = S.tpl;
    list.innerHTML = t.samples.map((s,i)=>{
      const r = tplCalc(s);
      return `<div class="trial">
        <div class="trial-head"><b>${esc(s.name)}</b><span class="flag">样例 ${i+1}</span></div>
        <div class="trial-line"><span>销售收入 × ${t.rate}</span><strong>${(s.sales*t.rate).toFixed(2)} 万元</strong></div>
        <div class="trial-line"><span>面积 × 亩均投入 × 系数</span><strong>${(s.area*s.perMu*t.coef/10000).toFixed(2)} 万元</strong></div>
        <div class="trial-line"><span>政策上限</span><strong>${t.cap} 万元</strong></div>
        <div class="trial-result"><span style="font-size:10px;color:var(--ink-3)">建议额度</span><span class="amt">${nf(r)} 万元</span></div>
      </div>`;
    }).join("");
    const flag = document.getElementById("trial-flag");
    if(flag){
      flag.className = "pill pill-green";
      flag.innerHTML = `<i></i>${t.samples.length} / ${t.samples.length} 通过`;
    }
    const vs = document.getElementById("veto-state");
    if(vs){
      const n = Object.values(t.veto).filter(Boolean).length;
      vs.textContent = n ? `已启用 ${n} 项 · 样例未命中` : "未配置否决项";
    }
    const json = document.getElementById("rule-json");
    if(json) json.innerHTML = ruleJson();
  }

  /* 深链：便于评审时直接打开某一端、某一页签 */
  (function initFromHash(){
    const h = decodeURIComponent(location.hash.replace(/^#/, ""));
    if(!h) return;
    const [role, view, tab] = h.split("/");
    if(!["client","bank","guarantee","admin"].includes(role)) return;
    const allowed = {
      client:["client"],
      bank:["bank-home","bank-pool","bank-detail"],
      guarantee:["g-home","g-review"],
      admin:["admin-tpl","admin-rules","admin-source","admin-audit"]
    }[role];
    S.role = role;
    S.view = allowed.includes(view) ? view : { client:"client", bank:"bank-home", guarantee:"g-home", admin:"admin-tpl" }[role];
    S.tab = ["overview","profile","limit","report","flow","materials"].includes(tab) ? tab : "overview";
    if(S.view==="bank-detail") S.appNo = "NX2026120007";
  })();

  window.addEventListener("hashchange", () => {
    const h = decodeURIComponent(location.hash.replace(/^#/, ""));
    if(!h){ S.role = null; S.view = "cover"; render(); return; }
    const [role, view, tab] = h.split("/");
    if(!["client","bank","guarantee","admin"].includes(role)) return;
    S.role = role; S.view = view || S.view; S.tab = tab || "overview";
    if(S.view==="bank-detail") S.appNo = "NX2026120007";
    render();
  });

  render();
})();

  </script>
</body>
</html>
