<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>兴农联担 · 银担协同智能授信平台</title>
<meta name="description" content="兴农联担——银担协同赋能乡村振兴的智能授信平台，高保真产品原型。" />
<style>
/* =========================================================
   兴农联担 · 设计系统
   纸感账本 × 深松绿 × 印章金  |  Institutional Agri-Finance
   ========================================================= */

:root{
  --paper:#F2EEE2;
  --paper-2:#FCFAF3;
  --paper-3:#F7F3E8;
  --ink:#17211B;
  --ink-2:#4A554D;
  --ink-3:#7D877E;
  --line:#E2DAC7;
  --line-2:#EEE7D7;
  --green-950:#082119;
  --green-900:#0B2C22;
  --green-800:#103C2E;
  --green-700:#18513F;
  --green-600:#216850;
  --green-500:#2E8666;
  --green-100:#DDE9E1;
  --gold:#B5893C;
  --gold-2:#D9BD84;
  --gold-soft:#F1E5C9;
  --red:#A23F2B;
  --red-soft:#F5E4DE;
  --amber:#B3781F;
  --amber-soft:#F6EAD3;
  --blue:#3C6B78;
  --blue-soft:#E2EDF0;
  --slate:#5F6E65;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Hiragino Sans GB","Segoe UI",sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono","Consolas","Courier New",monospace;
  --r:3px;
  --rail-w:238px;
  --shadow:0 1px 0 rgba(23,33,27,.04),0 12px 34px -22px rgba(23,33,27,.28);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
::selection{background:var(--gold-soft);color:var(--green-900)}
h1,h2,h3,h4{margin:0;font-weight:600}
p{margin:0}
ul,ol{margin:0;padding:0}
img{max-width:100%}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.serif{font-family:var(--serif)}
.mono{font-family:var(--mono)}

/* ---------- 纸纹与细线 ---------- */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(rgba(12,44,34,.035) 1px,transparent 1px),
    repeating-linear-gradient(0deg,rgba(12,44,34,.018) 0 1px,transparent 1px 4px);
  background-size:26px 26px,100% 4px;
  opacity:.55;
}

/* =========================================================
   COVER
   ========================================================= */
.cover{
  position:relative;min-height:100vh;padding:40px clamp(28px,5vw,76px) 30px;
  background:
    radial-gradient(1200px 700px at 12% -10%,rgba(46,134,102,.28),transparent 62%),
    radial-gradient(900px 600px at 96% 108%,rgba(181,137,60,.16),transparent 60%),
    linear-gradient(158deg,#0A241C 0%,#0C2C22 46%,#082018 100%);
  color:#EDE8D9;overflow:hidden;display:flex;flex-direction:column;
}
.cover::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.021) 0 1px,transparent 1px 7px);
  mix-blend-mode:overlay;opacity:.5;
}
.hero-lines{position:absolute;inset:0;opacity:.16;pointer-events:none}
.cover-head{position:relative;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.brand-lock{display:flex;align-items:center;gap:14px}
.seal{
  width:46px;height:46px;border:1px solid rgba(217,189,132,.62);border-radius:2px;
  display:grid;grid-template-columns:1fr 1fr;place-items:center;
  font-family:var(--serif);font-size:15px;line-height:1;color:var(--gold-2);
  letter-spacing:.02em;position:relative;background:rgba(217,189,132,.05)
}
.seal::after{content:"";position:absolute;inset:3px;border:1px solid rgba(217,189,132,.22)}
.seal span{display:block}
.brand-lock .cn{font-family:var(--serif);font-size:21px;letter-spacing:.14em;color:#F1EAD8}
.brand-lock .en{font-size:10px;letter-spacing:.22em;color:rgba(237,232,217,.52);text-transform:uppercase;margin-top:2px}
.cover-tag{
  border:1px solid rgba(217,189,132,.28);padding:7px 12px;font-size:11px;letter-spacing:.16em;
  color:rgba(237,232,217,.7);background:rgba(255,255,255,.03)
}
.cover-body{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(560px,.88fr);gap:clamp(28px,4vw,64px);align-items:center;flex:1;padding:48px 0 30px}
.cover-copy{max-width:660px}
.cover-kicker{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.26em;color:var(--gold-2);text-transform:uppercase}
.cover-kicker::before{content:"";width:26px;height:1px;background:var(--gold-2);opacity:.8}
.cover-title{font-family:var(--serif);font-weight:600;font-size:clamp(38px,5vw,64px);line-height:1.14;letter-spacing:.02em;margin:18px 0 0}
.cover-title em{font-style:normal;color:var(--gold-2)}
.cover-lead{font-size:15px;line-height:1.9;color:rgba(237,232,217,.76);margin-top:22px;max-width:560px}
.cover-lead strong{color:#F4EEDD;font-weight:500;border-bottom:1px solid rgba(217,189,132,.42);padding-bottom:1px}
.cover-facts{display:flex;flex-wrap:wrap;gap:0;margin-top:34px;border-top:1px solid rgba(217,189,132,.18);max-width:600px}
.cover-fact{padding:16px 26px 0 0;margin-right:26px;position:relative}
.cover-fact + .cover-fact::before{content:"";position:absolute;left:-26px;top:18px;bottom:6px;width:1px;background:rgba(217,189,132,.16)}
.cover-fact b{display:block;font-family:var(--serif);font-size:21px;color:#F2EBD9;font-weight:600}
.cover-fact small{display:block;font-size:10.5px;letter-spacing:.14em;color:rgba(237,232,217,.48);margin-top:4px}
.cover-roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role-card{
  text-align:left;background:rgba(252,250,243,.055);border:1px solid rgba(217,189,132,.19);
  padding:20px 18px 18px;border-radius:2px;color:#EDE8D9;position:relative;overflow:hidden;
  transition:background .22s ease,border-color .22s ease,transform .22s ease;
  backdrop-filter:blur(2px);
}
.role-card:hover{background:rgba(252,250,243,.1);border-color:rgba(217,189,132,.44);transform:translateY(-2px)}
.role-card .idx{font-family:var(--serif);font-size:11px;letter-spacing:.18em;color:var(--gold-2);opacity:.75}
.role-card h3{font-family:var(--serif);font-weight:600;font-size:20px;margin:10px 0 6px;letter-spacing:.04em}
.role-card p{font-size:11.5px;line-height:1.7;color:rgba(237,232,217,.56);min-height:40px}
.role-card .go{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid rgba(217,189,132,.16);font-size:10.5px;letter-spacing:.14em;color:rgba(237,232,217,.66)}
.role-card .go i{display:inline-block;width:18px;height:1px;background:var(--gold-2);position:relative;transition:width .2s ease}
.role-card .go i::after{content:"";position:absolute;right:0;top:-2px;width:5px;height:5px;border-top:1px solid var(--gold-2);border-right:1px solid var(--gold-2);transform:rotate(45deg)}
.role-card:hover .go i{width:28px}
.cover-foot{position:relative;z-index:2;display:flex;justify-content:space-between;gap:24px;border-top:1px solid rgba(217,189,132,.16);padding-top:18px;font-size:10.5px;letter-spacing:.08em;color:rgba(237,232,217,.42)}
.cover-foot span{max-width:62%}

/* =========================================================
   SHELL
   ========================================================= */
.app-shell{position:relative;z-index:1}
.shell{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:100vh}
.rail{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  background:linear-gradient(179deg,#0A251C 0%,#0D3126 48%,#0A231B 100%);
  color:#E9E5D6;border-right:1px solid rgba(217,189,132,.16);overflow:hidden;
}
.rail::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 1px,transparent 1px 6px);pointer-events:none}
.rail-brand{padding:24px 22px 22px;border-bottom:1px solid rgba(217,189,132,.14);position:relative;z-index:1}
.rail-brand .brand-lock{gap:11px}
.rail-brand .seal{width:38px;height:38px;font-size:12.5px}
.rail-brand .cn{font-size:16px;letter-spacing:.13em}
.rail-brand .en{font-size:8.5px;letter-spacing:.2em}
.rail-org{padding:14px 22px 6px;font-size:10px;letter-spacing:.16em;color:rgba(233,229,214,.42);position:relative;z-index:1}
.rail-nav{flex:1;overflow:auto;padding:8px 14px 20px;position:relative;z-index:1;scrollbar-width:thin}
.rail-group{font-size:9.5px;letter-spacing:.2em;color:rgba(217,189,132,.58);margin:18px 8px 7px}
.rail-item{
  display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:2px;color:rgba(233,229,214,.72);
  font-size:12.5px;letter-spacing:.02em;border:none;background:transparent;width:100%;text-align:left;
  transition:background .16s ease,color .16s ease;position:relative
}
.rail-item:hover{background:rgba(255,255,255,.055);color:#F1EBDD}
.rail-item.active{background:rgba(217,189,132,.1);color:#F6F0DF}
.rail-item.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;background:var(--gold-2)}
.rail-item svg{width:15px;height:15px;opacity:.62;flex:0 0 auto}
.rail-item.active svg{opacity:.94}
.rail-item .tail{margin-left:auto;font-size:10px;color:rgba(233,229,214,.4)}
.rail-item.active .tail{color:var(--gold-2)}
.rail-foot{padding:14px 22px 20px;border-top:1px solid rgba(217,189,132,.14);font-size:10px;letter-spacing:.06em;color:rgba(233,229,214,.4);position:relative;z-index:1;line-height:1.8}
.rail-foot b{display:block;color:rgba(233,229,214,.7);font-weight:500;letter-spacing:.12em;font-size:10.5px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  height:60px;display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:0 clamp(18px,2.6vw,36px);border-bottom:1px solid var(--line);
  background:rgba(242,238,226,.88);backdrop-filter:blur(10px);position:sticky;top:0;z-index:30
}
.crumb{display:flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.1em;color:var(--ink-3)}
.crumb b{font-weight:500;color:var(--ink-2);font-family:var(--serif);font-size:12.5px;letter-spacing:.06em}
.crumb span{opacity:.55}
.topbar-right{display:flex;align-items:center;gap:10px}
.demo-tag{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.12em;color:var(--slate);border:1px solid var(--line);padding:5px 9px;background:rgba(252,250,243,.6)}
.demo-tag i{width:5px;height:5px;border-radius:50%;background:var(--green-500)}
.role-pill{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.06em;color:var(--green-800);background:var(--green-100);border:1px solid #C8D9CD;padding:5px 10px}
.role-pill svg{width:12px;height:12px}
.switch-role{border:1px solid var(--line);background:transparent;color:var(--ink-2);font-size:10.5px;letter-spacing:.06em;padding:6px 10px;transition:.18s}
.switch-role:hover{border-color:var(--gold);color:var(--green-800)}
.page{padding:clamp(22px,2.8vw,38px) clamp(18px,2.8vw,38px) 48px;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin-bottom:24px}
.eyebrow{display:flex;align-items:center;gap:9px;font-size:10px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
.eyebrow::before{content:"";width:16px;height:1px;background:var(--gold);opacity:.9}
.page-title{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:.02em;line-height:1.24;margin-top:8px}
.page-title .thin{font-weight:400;color:var(--ink-3);font-size:22px}
.page-sub{font-size:12px;color:var(--ink-3);margin-top:7px;line-height:1.7;max-width:760px}
.page-actions{display:flex;gap:9px;flex-wrap:wrap}

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:2px;border:1px solid transparent;padding:8px 15px;font-size:12px;letter-spacing:.04em;transition:.18s ease;white-space:nowrap}
.btn svg{width:13px;height:13px}
.btn-primary{background:linear-gradient(180deg,var(--green-700),var(--green-800));color:#F7F2E4;border-color:#0E4634;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(8,33,25,.18)}
.btn-primary:hover{background:linear-gradient(180deg,#1C5D47,#0F4534);transform:translateY(-1px)}
.btn-gold{background:linear-gradient(180deg,#C49A4E,#A87C31);color:#231A0A;border-color:#8A6424;box-shadow:inset 0 1px 0 rgba(255,255,255,.26)}
.btn-gold:hover{transform:translateY(-1px)}
.btn-ghost{border-color:var(--line);background:rgba(252,250,243,.7);color:var(--ink-2)}
.btn-ghost:hover{border-color:#CDBF9F;background:#FCFAF3;color:var(--green-800)}
.btn-danger{border-color:#D8B3A7;background:var(--red-soft);color:var(--red)}
.btn-danger:hover{background:#F0D7CF}
.btn-text{border:none;background:none;color:var(--green-700);font-size:11.5px;padding:4px 0;border-bottom:1px solid transparent}
.btn-text:hover{border-bottom-color:var(--green-700)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important}
.icon-btn{width:30px;height:30px;padding:0;border:1px solid var(--line);background:rgba(252,250,243,.65);display:inline-flex;align-items:center;justify-content:center;border-radius:2px;color:var(--ink-2);transition:.18s}
.icon-btn:hover{border-color:var(--gold);color:var(--green-800)}

/* ---------- 卡片 / 栅格 ---------- */
.card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-pad{padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 20px;border-bottom:1px solid var(--line-2)}
.card-head h3{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.04em}
.card-head .hint{font-size:10.5px;letter-spacing:.05em;color:var(--ink-3)}
.card-body{padding:18px 20px}
.stack{display:flex;flex-direction:column;gap:14px}
.two-col{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(300px,.78fr);gap:16px}
.two-col-even{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.three-col{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.four-col{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.section-title{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.section-title h2{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:.03em}
.section-title small{font-size:10.5px;color:var(--ink-3);letter-spacing:.06em}
.hairline{height:1px;background:var(--line-2);margin:16px 0}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:1.35fr repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--paper-2);border:1px solid var(--line);border-radius:2px;padding:17px 18px 15px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.kpi.dark{background:linear-gradient(160deg,#123F32,#0B2C22);color:#EFEAD9;border-color:#0F4634}
.kpi.dark::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.024) 0 1px,transparent 1px 5px);pointer-events:none}
.kpi-label{font-size:10px;letter-spacing:.14em;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.kpi.dark .kpi-label{color:rgba(239,234,217,.56)}
.kpi-value{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.2;margin-top:9px;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.kpi-value small{font-family:var(--sans);font-size:11px;font-weight:400;color:var(--ink-3);margin-left:4px}
.kpi.dark .kpi-value small{color:rgba(239,234,217,.56)}
.kpi-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:10.5px;color:var(--ink-3)}
.kpi.dark .kpi-foot{color:rgba(239,234,217,.5)}
.delta{font-size:10px;letter-spacing:.03em;color:var(--green-600)}
.delta.down{color:var(--red)}
.kpi-spark{position:absolute;right:12px;bottom:10px;width:66px;height:26px;opacity:.5}

/* ---------- 表格 ---------- */
.table{width:100%;border-collapse:collapse}
.table th{
  text-align:left;font-weight:500;font-size:10px;letter-spacing:.1em;color:var(--ink-3);
  padding:10px 12px;border-bottom:1px solid var(--line);background:var(--paper-3);white-space:nowrap
}
.table td{padding:12px;border-bottom:1px solid var(--line-2);font-size:12px;vertical-align:middle;color:var(--ink-2)}
.table tr:last-child td{border-bottom:none}
.table tbody tr{transition:background .14s ease;cursor:pointer}
.table tbody tr:hover{background:#F7F2E4}
.table .num{font-variant-numeric:tabular-nums}
.table .strong{color:var(--ink);font-weight:500}
.table .muted{color:var(--ink-3);font-size:11px}
.table-wrap{overflow:auto;scrollbar-width:thin}
.table-wrap .table{min-width:900px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:3px 8px;border-radius:2px;border:1px solid;line-height:1.5;white-space:nowrap;letter-spacing:.02em}
.pill i{width:4px;height:4px;border-radius:50%;flex:0 0 auto}
.pill-green{color:#1B6249;background:#E4EEE6;border-color:#C9DBCD}.pill-green i{background:#2E8666}
.pill-amber{color:#8C5C13;background:var(--amber-soft);border-color:#E6D2AA}.pill-amber i{background:#B3781F}
.pill-red{color:#8D3323;background:var(--red-soft);border-color:#E3C2B7}.pill-red i{background:#A23F2B}
.pill-blue{color:#2E5A66;background:var(--blue-soft);border-color:#C7DBE0}.pill-blue i{background:#3C6B78}
.pill-gray{color:var(--slate);background:#EDEAE0;border-color:#DCD7C8}.pill-gray i{background:#7D877E}
.pill-gold{color:#7C5B1D;background:var(--gold-soft);border-color:#E1CFA4}.pill-gold i{background:#B5893C}

.meter{height:4px;background:#E7E0CF;position:relative;width:72px;display:inline-block;vertical-align:middle;overflow:hidden}
.meter > span{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#2E8666,#18513F);width:var(--w,60%)}
.meter.amber > span{background:linear-gradient(90deg,#D3A055,#B3781F)}
.meter.red > span{background:linear-gradient(90deg,#C67457,#A23F2B)}

/* ---------- Tabs ---------- */
.tabs{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line);overflow:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:none;background:transparent;padding:10px 15px;font-size:12px;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap;transition:.16s}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--green-800);border-bottom-color:var(--gold);font-weight:500;background:linear-gradient(180deg,transparent,rgba(181,137,60,.06))}
.tab .cnt{font-size:9.5px;color:var(--ink-3);margin-left:4px}

/* ---------- 待办 ---------- */
.todo-item{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--line-2);cursor:pointer;transition:.15s}
.todo-item:last-child{border-bottom:none}
.todo-item:hover{padding-left:4px}
.todo-rank{font-family:var(--serif);font-size:11px;color:var(--gold);width:18px;flex:0 0 auto;opacity:.8}
.todo-main{flex:1;min-width:0}
.todo-main b{display:block;font-size:12.5px;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo-main > span{display:block;font-size:10.5px;color:var(--ink-3);margin-top:3px}
.todo-main .tag{display:inline-block;margin-top:5px}
.todo-right{text-align:right;flex:0 0 auto}
.todo-right .amt{font-family:var(--serif);font-size:14px;color:var(--ink);display:block}
.todo-right small{font-size:9.5px;color:var(--ink-3)}
.tag{display:inline-block;font-size:9.5px;letter-spacing:.05em;padding:1px 6px;border:1px solid var(--line);color:var(--ink-3);background:#F8F4E9;margin-left:5px;vertical-align:1px}
.tag.hot{color:var(--red);border-color:#E3C2B7;background:#FBF0EC}

/* ---------- 图表 ---------- */
.barchart{display:flex;align-items:flex-end;gap:9px;height:120px;padding-top:8px}
.barchart .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.barchart .bar i{width:100%;max-width:22px;background:linear-gradient(180deg,#3A9673,#1B5C46);display:block;transition:height .5s cubic-bezier(.2,.7,.2,1);border-radius:1px 1px 0 0;position:relative}
.barchart .bar i.today{background:linear-gradient(180deg,#D3B16B,#B5893C)}
.barchart .bar span{font-size:9px;color:var(--ink-3);letter-spacing:.03em}
.barchart .bar b{font-size:9.5px;color:var(--ink-2);font-weight:500;font-variant-numeric:tabular-nums}
.hbars{display:flex;flex-direction:column;gap:11px}
.hbar{display:grid;grid-template-columns:56px 1fr 46px;align-items:center;gap:10px;font-size:10.5px;color:var(--ink-2)}
.hbar .track{height:6px;background:#E8E1D1;position:relative;border-radius:1px;overflow:hidden}
.hbar .track i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2E8666,#18513F)}
.hbar .track i.gold{background:linear-gradient(90deg,#C9A25B,#A87C31)}
.hbar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.donut-wrap{display:flex;align-items:center;gap:18px}
.donut{width:104px;height:104px;position:relative;flex:0 0 auto}
.donut svg{width:100%;height:100%}
.donut b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);font-size:19px;color:var(--ink)}
.donut b small{font-family:var(--sans);font-size:8.5px;color:var(--ink-3);letter-spacing:.08em;margin-top:2px}
.legend{display:flex;flex-direction:column;gap:7px;font-size:10.5px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:6px;height:6px;border-radius:50%}

/* ---------- 进度 ---------- */
.flow{display:flex;align-items:flex-start;gap:0;margin:6px 0 2px}
.flow-step{flex:1;position:relative;text-align:center;min-width:0}
.flow-step::before{content:"";position:absolute;top:13px;left:50%;right:-50%;height:1px;background:var(--line);z-index:0}
.flow-step:last-child::before{display:none}
.flow-step.done::before,.flow-step.current::before{background:var(--green-500)}
.flow-dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--paper-2);display:flex;align-items:center;justify-content:center;margin:0 auto;position:relative;z-index:1;font-family:var(--serif);font-size:10px;color:var(--ink-3)}
.flow-step.done .flow-dot{background:var(--green-700);border-color:var(--green-800);color:#F3EEDD}
.flow-step.current .flow-dot{border-color:var(--gold);color:#7C5B1D;background:var(--gold-soft);box-shadow:0 0 0 4px rgba(181,137,60,.12)}
.flow-label{font-size:10.5px;color:var(--ink-3);margin-top:8px;letter-spacing:.02em}
.flow-step.done .flow-label,.flow-step.current .flow-label{color:var(--ink)}
.flow-time{font-size:9px;color:var(--ink-3);margin-top:2px;font-variant-numeric:tabular-nums}

/* ---------- 字段溯源 ---------- */
.field-group{margin-bottom:16px}
.field-group h4{font-family:var(--serif);font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--ink);display:flex;align-items:center;gap:8px;margin-bottom:6px}
.field-group h4::after{content:"";flex:1;height:1px;background:var(--line-2)}
.field-row{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px dotted #E8E1D2;font-size:11.5px}
.field-row:last-child{border-bottom:none}
.field-row .k{color:var(--ink-3);flex:0 0 auto}
.field-row .v{color:var(--ink);font-variant-numeric:tabular-nums;text-align:right;border-bottom:1px dashed rgba(46,134,102,.35);cursor:pointer;transition:.15s}
.field-row .v:hover{color:var(--green-700);border-bottom-color:var(--green-600)}
.field-row .v.warn{color:var(--red);border-bottom-color:rgba(162,63,43,.4)}
.source-card{background:linear-gradient(180deg,#FCFAF3,#F7F2E4);border:1px solid var(--line);border-radius:3px;padding:16px;box-shadow:var(--shadow);position:sticky;top:78px}
.source-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.source-head h3{font-family:var(--serif);font-size:14px;font-weight:600}
.source-head .conf{font-size:9.5px;letter-spacing:.08em;color:var(--green-700);border:1px solid #C9DBCD;background:#E4EEE6;padding:2px 6px}
.source-list{display:flex;flex-direction:column;gap:0}
.source-item{display:grid;grid-template-columns:66px 1fr;gap:10px;padding:8px 0;border-bottom:1px dotted #E6DFCE;font-size:10.5px;line-height:1.6}
.source-item:last-child{border-bottom:none}
.source-item label{color:var(--ink-3)}
.source-item span{color:var(--ink-2);word-break:break-all}
.evidence{margin-top:12px;border:1px dashed #D9CFB6;padding:9px;display:flex;align-items:center;gap:10px;background:#FBF7EA;cursor:pointer;transition:.18s}
.evidence:hover{border-color:var(--gold)}
.evidence .thumb{width:42px;height:32px;background:linear-gradient(135deg,#DDE9E1,#C9DBCD);border:1px solid #BFD2C4;display:flex;align-items:center;justify-content:center;font-size:8px;color:#2E6A50;letter-spacing:.06em;flex:0 0 auto}
.evidence small{display:block;font-size:9px;color:var(--ink-3);letter-spacing:.04em}
.evidence b{display:block;font-size:10.5px;font-weight:500;color:var(--ink-2)}

/* ---------- 额度测算 ---------- */
.formula{border:1px solid #D8CDB2;background:
  linear-gradient(180deg,#FBF7EA,#F6EEDC);padding:16px 18px;position:relative;overflow:hidden;border-radius:2px}
.formula::after{content:"计算口径 V1.3";position:absolute;right:12px;top:10px;font-size:8.5px;letter-spacing:.14em;color:#A98B58}
.formula .label{font-size:9.5px;letter-spacing:.16em;color:#8B7139}
.formula .expr{font-family:var(--mono);font-size:12.5px;color:#3D3321;margin-top:8px;line-height:1.9;word-break:break-word}
.formula .expr b{color:var(--green-700)}
.factor-row{display:grid;grid-template-columns:1.3fr .7fr 1fr 64px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-2);font-size:11.5px}
.factor-row:last-child{border-bottom:none}
.factor-row .fname{color:var(--ink);font-weight:500}
.factor-row .fname small{display:block;font-weight:400;color:var(--ink-3);font-size:9.5px;margin-top:2px}
.factor-bar{height:5px;background:#E9E2D2;position:relative;overflow:hidden}
.factor-bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#4A9C7B,#1B5C46)}
.factor-row .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.factor-row .dir{text-align:center;font-size:10px;color:var(--green-600)}
.factor-row .dir.neg{color:var(--red)}
.big-amount{font-family:var(--serif);font-size:42px;font-weight:600;line-height:1.1;color:var(--green-900);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.big-amount small{font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-left:5px;font-weight:400}
.coef-chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#FBF8EF;padding:5px 9px;font-size:10.5px;color:var(--ink-3);border-radius:2px;transition:.16s}
.chip.on{border-color:#9EC3AC;background:#DDEBE2;color:#18513F;font-weight:500}
.chip:hover{border-color:var(--gold)}
.adjust-box{border:1px dashed #D8CDB2;background:#FBF7EA;padding:14px;margin-top:14px}
.adjust-box label{font-size:10px;letter-spacing:.1em;color:var(--ink-3);display:block;margin-bottom:6px}
.input{width:100%;border:1px solid var(--line);background:#FCFAF3;padding:8px 10px;font-size:12px;border-radius:2px;outline:none;transition:.16s}
.input:focus{border-color:var(--green-600);box-shadow:0 0 0 3px rgba(46,134,102,.1)}
textarea.input{resize:vertical;min-height:70px;line-height:1.7}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#7D877E 50%),linear-gradient(135deg,#7D877E 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:26px}
.inline-field{display:flex;align-items:center;gap:8px}
.inline-field .unit{font-size:10px;color:var(--ink-3);white-space:nowrap}

/* ---------- 报告 ---------- */
.report-doc{background:#FFFDF8;border:1px solid var(--line);padding:26px 30px;box-shadow:0 2px 14px -10px rgba(23,33,27,.4);font-family:var(--serif);line-height:2;font-size:12.5px;color:#2B352E;position:relative}
.report-doc h3{font-size:17px;text-align:center;letter-spacing:.12em;margin-bottom:14px;font-weight:600}
.report-doc .meta{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.06em;color:var(--ink-3);border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:14px;font-family:var(--sans)}
.report-doc p{margin:0 0 9px;text-indent:2em}
.report-doc .cite{font-family:var(--sans);font-size:9px;background:#E4EEE6;color:#1B6249;border:1px solid #C9DBCD;padding:0 4px;margin:0 2px;letter-spacing:.02em;cursor:pointer;white-space:nowrap}
.report-doc .sec{font-family:var(--serif);font-weight:600;margin:14px 0 6px;font-size:13px;letter-spacing:.04em}

/* ---------- 时间线 ---------- */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--line)}
.event{position:relative;padding:0 0 18px}
.event::before{content:"";position:absolute;left:-22px;top:4px;width:9px;height:9px;border-radius:50%;border:1px solid #B9C9BD;background:var(--paper-2);z-index:1}
.event:first-child::before{background:var(--green-600);border-color:var(--green-700);box-shadow:0 0 0 3px rgba(46,134,102,.12)}
.event .etime{font-size:9.5px;color:var(--ink-3);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.event .etitle{font-size:12px;color:var(--ink);font-weight:500;margin-top:2px}
.event .etitle span{font-weight:400;color:var(--ink-3);font-size:10.5px;margin-left:8px}
.event .edesc{font-size:10.5px;color:var(--ink-3);line-height:1.7;margin-top:3px}

/* ---------- 手机端 ---------- */
.client-view{padding:clamp(20px,3vw,40px) clamp(18px,3.4vw,48px) 48px;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:clamp(24px,4vw,64px);align-items:start}
.journey-left{max-width:640px;padding-top:8px}
.journey-title{font-family:var(--serif);font-size:38px;line-height:1.3;letter-spacing:.02em;margin-top:10px}
.journey-title em{font-style:normal;color:var(--green-600)}
.journey-lead{font-size:12.5px;color:var(--ink-3);line-height:1.9;margin-top:14px;max-width:540px}
.journey-steps{margin-top:30px;border-top:1px solid var(--line)}
.jstep{display:grid;grid-template-columns:38px 1fr auto;gap:14px;padding:17px 8px 17px 2px;border-bottom:1px solid var(--line-2);cursor:pointer;transition:.18s;position:relative;align-items:start}
.jstep:hover{background:rgba(252,250,243,.7);padding-left:8px}
.jstep.active{background:linear-gradient(90deg,rgba(181,137,60,.08),transparent 80%)}
.jstep.active::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2px;background:var(--gold)}
.jstep .jno{font-family:var(--serif);font-size:19px;color:#C4B287;line-height:1.2}
.jstep.active .jno{color:var(--gold)}
.jstep h3{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.jstep p{font-size:10.5px;color:var(--ink-3);line-height:1.7;margin-top:4px;max-width:420px}
.jstep .jt{font-size:9.5px;color:var(--ink-3);white-space:nowrap;letter-spacing:.04em;text-align:right}
.jstep .jt b{display:block;color:var(--green-700);font-weight:500;font-size:10.5px}
.journey-note{margin-top:18px;display:flex;gap:9px;font-size:10px;color:var(--ink-3);line-height:1.7;border-left:2px solid var(--gold-2);padding-left:12px}
.phone-wrap{position:sticky;top:86px;display:flex;flex-direction:column;align-items:center}
.phone{width:392px;height:800px;background:#0C2C22;border-radius:46px;padding:9px;box-shadow:0 40px 80px -40px rgba(8,33,25,.55),0 0 0 1px rgba(217,189,132,.22),inset 0 0 0 2px rgba(255,255,255,.06);position:relative}
.phone::after{content:"";position:absolute;left:-3px;top:150px;width:2px;height:52px;background:#1B4C3B;border-radius:2px 0 0 2px}
.phone-screen{width:100%;height:100%;background:#FBF8EF;border-radius:38px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.m-status{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:10px;color:#2A352E;font-variant-numeric:tabular-nums;flex:0 0 auto}
.m-status .island{position:absolute;left:50%;transform:translateX(-50%);top:8px;width:86px;height:20px;background:#0B2019;border-radius:12px}
.m-status .right{display:flex;gap:5px;align-items:center}
.m-status .sig{display:flex;gap:2px;align-items:flex-end}
.m-status .sig i{width:2px;background:#2A352E;display:block}
.m-apphead{padding:6px 20px 12px;display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
.m-brand{display:flex;align-items:center;gap:8px}
.m-brand .mseal{width:24px;height:24px;border:1px solid #B5893C;color:#8F6A26;display:grid;grid-template-columns:1fr 1fr;place-items:center;font-family:var(--serif);font-size:7px;line-height:1}
.m-brand b{font-family:var(--serif);font-size:13px;letter-spacing:.08em;font-weight:600}
.m-screen{flex:1;overflow:auto;padding:2px 20px 16px;scrollbar-width:none}
.m-screen::-webkit-scrollbar{display:none}
.m-tabs{flex:0 0 auto;height:58px;border-top:1px solid #E7DFCE;display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:10px;background:rgba(251,248,239,.96)}
.m-tabs div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;color:#8A938B}
.m-tabs div svg{width:16px;height:16px;opacity:.6}
.m-tabs div.on{color:#18513F}
.m-tabs div.on svg{opacity:1}
.m-hero{background:linear-gradient(150deg,#123F32,#0B2C22);color:#F1ECDC;border-radius:4px;padding:16px;position:relative;overflow:hidden}
.m-hero::after{content:"";position:absolute;right:-22px;top:-28px;width:110px;height:110px;border:1px solid rgba(217,189,132,.2);border-radius:50%}
.m-hero .k{font-size:9px;letter-spacing:.14em;color:rgba(241,236,220,.55)}
.m-hero .v{font-family:var(--serif);font-size:30px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
.m-hero .v small{font-size:10px;font-family:var(--sans);color:rgba(241,236,220,.6);margin-left:3px}
.m-hero .foot{display:flex;justify-content:space-between;font-size:9px;color:rgba(241,236,220,.55);margin-top:10px;border-top:1px solid rgba(217,189,132,.16);padding-top:8px}
.m-label{font-size:9px;letter-spacing:.14em;color:#7D877E;margin:16px 0 8px;display:flex;align-items:center;justify-content:space-between}
.m-card{background:#FCFAF3;border:1px solid #E2DAC7;border-radius:3px;padding:13px}
.m-form-row{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;border-bottom:1px solid #EEE7D7;font-size:11px}
.m-form-row label{color:#7D877E}
.m-form-row b{font-weight:500;color:#17211B;font-variant-numeric:tabular-nums}
.m-input{border:1px solid #E2DAC7;background:#FCFAF3;width:100%;padding:9px 10px;font-size:11px;border-radius:2px;outline:none}
.m-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;background:linear-gradient(180deg,#1C5D47,#0F4534);color:#F7F2E4;border:none;border-radius:2px;font-size:11.5px;letter-spacing:.06em;margin-top:13px}
.m-btn.ghost{background:transparent;border:1px solid #D8CFB9;color:#4A554D}
.m-pill{display:inline-flex;align-items:center;gap:4px;font-size:8.5px;padding:2px 6px;border:1px solid #C9DBCD;background:#E4EEE6;color:#1B6249;border-radius:2px}
.m-progress{display:flex;gap:4px;margin-top:10px}
.m-progress i{height:3px;flex:1;background:#E4DCC9;border-radius:2px}
.m-progress i.on{background:#B5893C}
.m-step-title{font-family:var(--serif);font-size:20px;line-height:1.35;letter-spacing:.02em;margin:6px 0 4px}
.m-step-sub{font-size:9.5px;color:#7D877E;line-height:1.6}
.m-photo{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.m-photo div{height:62px;border:1px dashed #D8CFB9;border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:8px;color:#8A938B;background:#F8F4E9}
.m-photo div.done{border-style:solid;border-color:#C9DBCD;background:linear-gradient(150deg,#E6EFE8,#F2F7F3);color:#2E6A50}
.m-timeline{position:relative;margin-top:4px}
.m-tl{display:flex;gap:10px;padding-bottom:14px;position:relative}
.m-tl .dot{width:14px;height:14px;border-radius:50%;border:1px solid #D3C7AC;background:#FCFAF3;flex:0 0 auto;position:relative;z-index:1;display:flex;align-items:center;justify-content:center}
.m-tl .dot.done{background:#18513F;border-color:#18513F;color:#F1ECDC;font-size:7px}
.m-tl .dot.cur{border-color:#B5893C;background:#F1E5C9}
.m-tl::before{content:"";position:absolute;left:6.5px;top:14px;bottom:0;width:1px;background:#E2DAC7}
.m-tl:last-child::before{display:none}
.m-tl b{display:block;font-size:10.5px;color:#17211B;font-weight:500}
.m-tl span{display:block;font-size:8.5px;color:#7D877E;margin-top:2px;line-height:1.6}
.m-tl .st{margin-left:auto;flex:0 0 auto;font-size:8px;color:#8C5C13}
.m-note{font-size:8.5px;line-height:1.7;color:#8A6B2B;background:#F6EAD3;border-left:2px solid #C9A25B;padding:8px 9px;margin-top:10px}
.m-listitem{display:flex;align-items:center;justify-content:space-between;padding:9px 2px;border-bottom:1px solid #EEE7D7;font-size:10.5px}
.m-listitem:last-child{border-bottom:none}
.m-listitem b{font-weight:500}
.m-listitem small{display:block;font-size:8.5px;color:#8A938B;margin-top:2px}

/* ---------- 模板编辑器 ---------- */
.template-list{display:flex;flex-direction:column;gap:2px}
.tpl{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:12px 12px;border:1px solid transparent;border-bottom:1px solid var(--line-2);cursor:pointer;transition:.16s;background:transparent;text-align:left;width:100%}
.tpl:hover{background:#F8F4E8}
.tpl.active{background:#FCFAF3;border-color:var(--line);box-shadow:var(--shadow)}
.tpl .nm{font-family:var(--serif);font-size:13px;font-weight:600;letter-spacing:.03em}
.tpl .mt{font-size:9.5px;color:var(--ink-3);margin-top:4px;line-height:1.6}
.tpl .ver{font-size:9px;color:#7C5B1D;background:var(--gold-soft);border:1px solid #E1CFA4;padding:1px 5px;white-space:nowrap}
.editor-split{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);gap:0;border-top:1px solid var(--line);min-height:640px}
.editor-form{padding:20px 22px;border-right:1px solid var(--line);overflow:auto;max-height:720px}
.editor-preview{background:#F7F3E8;padding:20px 22px;overflow:auto;max-height:720px}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:10px;letter-spacing:.12em;color:var(--ink-3);margin-bottom:7px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.form-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.check{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);background:#FBF8EF;font-size:10.5px;cursor:pointer;transition:.16s;border-radius:2px}
.check:hover{border-color:var(--gold)}
.check.on{border-color:#BFD2C4;background:#E4EEE6;color:#1B6249}
.check i{width:11px;height:11px;border:1px solid #C9C1AC;display:flex;align-items:center;justify-content:center;font-size:8px;flex:0 0 auto;background:#fff}
.check.on i{background:var(--green-700);border-color:var(--green-800);color:#fff}
.trial{background:#FCFAF3;border:1px solid var(--line);padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.trial-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.trial-head b{font-family:var(--serif);font-size:12px;font-weight:600}
.trial-line{display:flex;justify-content:space-between;font-size:10.5px;padding:4px 0;color:var(--ink-3);font-variant-numeric:tabular-nums}
.trial-line strong{color:var(--ink-2);font-weight:500}
.trial-result{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--line);margin-top:9px;padding-top:9px}
.trial-result .amt{font-family:var(--serif);font-size:24px;color:var(--green-900);font-weight:600;font-variant-numeric:tabular-nums}
.trial-result .flag{font-size:9px;padding:2px 6px;border:1px solid #C9DBCD;background:#E4EEE6;color:#1B6249}
.rule-json{font-family:var(--mono);font-size:10px;line-height:1.9;background:#0E2C23;color:#CFE0D5;padding:14px;border-radius:2px;overflow:auto;max-height:270px;margin-top:12px}
.rule-json .k{color:#D9BD84}
.rule-json .s{color:#9FCBB4}

/* ---------- 弹层 ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(9,30,23,.46);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .18s ease}
.modal{background:var(--paper-2);border:1px solid #D8CDB2;box-shadow:0 30px 70px -30px rgba(8,33,25,.6);max-width:520px;width:100%;animation:rise .22s cubic-bezier(.2,.7,.2,1);position:relative}
.modal::before{content:"";position:absolute;inset:5px;border:1px solid rgba(181,137,60,.26);pointer-events:none}
.modal-head{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-family:var(--serif);font-size:17px;letter-spacing:.06em;font-weight:600}
.modal-body{padding:18px 22px}
.modal-foot{padding:14px 22px 18px;display:flex;justify-content:flex-end;gap:9px;border-top:1px solid var(--line-2)}
.modal .close{border:none;background:none;color:var(--ink-3);font-size:18px;line-height:1;padding:4px}
.modal-text{font-size:11.5px;color:var(--ink-2);line-height:1.9}
.modal-text b{color:var(--ink)}
.warn-line{font-size:10.5px;color:#8C5C13;background:var(--amber-soft);border-left:2px solid #C9A25B;padding:9px 11px;margin-top:12px;line-height:1.7}
.seal-stamp{position:absolute;right:24px;bottom:18px;width:92px;height:92px;border:2px solid rgba(162,63,43,.62);border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;color:rgba(162,63,43,.68);font-family:var(--serif);font-size:8.5px;line-height:1.35;letter-spacing:.1em;transform:rotate(-13deg);animation:stamp .4s cubic-bezier(.2,.9,.3,1.2);opacity:.9}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#0D3126;color:#F2ECDC;border:1px solid rgba(217,189,132,.4);padding:11px 18px;font-size:11.5px;letter-spacing:.04em;z-index:200;box-shadow:0 18px 40px -18px rgba(8,33,25,.6);display:flex;align-items:center;gap:9px;animation:rise .2s ease}
.toast i{width:6px;height:6px;border-radius:50%;background:var(--gold-2)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes stamp{from{opacity:0;transform:rotate(-13deg) scale(1.5)}to{opacity:.9;transform:rotate(-13deg) scale(1)}}

/* ---------- 杂项 ---------- */
.note-mini{font-size:9.5px;color:var(--ink-3);line-height:1.7}
.check-list{display:flex;flex-direction:column;gap:0}
.check-row{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px dotted #E6DFCE;font-size:11px;line-height:1.7}
.check-row:last-child{border-bottom:none}
.check-row .ok{width:14px;height:14px;border-radius:50%;background:#E4EEE6;border:1px solid #C9DBCD;color:#1B6249;display:flex;align-items:center;justify-content:center;font-size:8px;flex:0 0 auto;margin-top:2px}
.check-row .warnmark{background:var(--amber-soft);border-color:#E6D2AA;color:#8C5C13}
.check-row .bad{background:var(--red-soft);border-color:#E3C2B7;color:#8D3323}
.check-row b{font-weight:500;color:var(--ink-2)}
.check-row span{color:var(--ink-3);font-size:10px}
.doc-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.doc{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#FBF8EF;padding:9px 10px;font-size:10.5px;cursor:pointer;transition:.16s}
.doc:hover{border-color:var(--gold);background:#FCFAF3}
.doc .ic{width:24px;height:28px;border:1px solid #D8CFB9;background:#F3EDDC;display:flex;align-items:center;justify-content:center;font-size:7px;color:#8A7139;letter-spacing:.05em;flex:0 0 auto}
.doc small{display:block;color:var(--ink-3);font-size:8.5px;margin-top:2px}

/* ---------- 响应式 ---------- */
@media (max-width:1280px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .kpi:first-child{grid-column:span 1}
  .factor-row{grid-template-columns:1.2fr .6fr .9fr 50px}
}
@media (max-width:1100px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;padding:0 12px;min-height:58px}
  .rail-brand{padding:10px 14px;border:none;border-right:1px solid rgba(217,189,132,.14)}
  .rail-org,.rail-foot{display:none}
  .rail-nav{display:flex;flex-wrap:wrap;gap:2px;padding:6px}
  .rail-group{display:none}
  .rail-item{padding:8px 10px;width:auto;font-size:11px}
  .rail-item .tail{display:none}
  .client-view{grid-template-columns:1fr;justify-items:center}
  .journey-left{max-width:100%}
  .phone-wrap{position:static}
  .two-col,.two-col-even{grid-template-columns:1fr}
  .four-col{grid-template-columns:repeat(2,1fr)}
  .editor-split{grid-template-columns:1fr}
  .editor-form{border-right:none;border-bottom:1px solid var(--line);max-height:none}
  .editor-preview{max-height:none}
  .cover-body{grid-template-columns:1fr;padding-top:30px}
}
@media (max-width:720px){
  .page-title{font-size:24px}
  .kpis{grid-template-columns:1fr 1fr}
  .three-col{grid-template-columns:1fr}
  .cover{padding:26px 20px}
  .cover-title{font-size:36px}
  .cover-roles{grid-template-columns:1fr}
  .cover-facts{flex-wrap:wrap}
  .cover-foot{flex-direction:column;font-size:9.5px}
  .cover-foot span{max-width:100%}
  .phone{width:342px;height:700px}
  .page-head{flex-direction:column;align-items:flex-start}
  .factor-row{grid-template-columns:1fr;gap:4px}
  .factor-row .val{text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

  function coefValue(){
    return D.coefBase + D.coefItems.reduce((a,i)=> a + (S.coefOn[i.key] ? i.add : 0), 0);
  }
  function limitCalc(){
    const sales = 104.5 * 0.56;
    const cost = 120 * 5000 * coefValue() / 10000; // 万元
    const policy = 300;
    const min = Math.min(sales, cost, policy);
    return { sales, cost, policy, min, suggest: Math.floor(min) };
  }
  function tplCalc(sample){
    const c = Math.min(sample.sales * 0.56, sample.area * sample.perMu * S.tpl.coef / 10000, S.tpl.cap);
    return Math.floor(c);
  }

      <div class="m-label">冲突校验</div>
      <div class="m-card" style="padding:10px 12px">
        ${[["面积 -1.2%","阈值 15%"],["订单 +6.3%","阈值 20%"],["投保 -8.3%","阈值 15%"]].map(x=>`<div style="display:flex;justify-content:space-between;font-size:9px;padding:3px 0;color:#4A554D"><span>${x[0]}</span><span style="color:#7D877E">${x[1]} · 通过</span></div>`).join("")}
      </div>
      <div class="m-note">完整度低于 60% 只出材料清单，不出额度；数据不全时给数字，客户会当成承诺。</div>
      <button class="m-btn" data-action="jnext">查看预授信结果</button>`;
    }
    if(step===3){
      return `
      <div style="margin-top:6px;display:flex;justify-content:space-between;align-items:center"><span class="m-pill">S08 · 并联审批中</span><span style="font-size:8.5px;color:#8A938B">预计 11-22 完成</span></div>
      <div class="m-step-title" style="margin-top:10px">银行与农担，<br>在看同一块屏。</div>
      <div class="m-step-sub">材料只交一次，节点同时推进；责任仍由双方各自签批。</div>
      <div class="m-card" style="margin-top:12px;padding:12px">
        <div class="m-timeline">
          <div class="m-tl"><div class="dot done">✓</div><div><b>银行受理 · 陈旻</b><span>11-20 10:12 · 建议额度 58 万元</span></div><span class="st">已完成</span></div>
          <div class="m-tl"><div class="dot done">✓</div><div><b>农担在保校验</b><span>单户余额 96 万 / 上限 1,000 万</span></div><span class="st">通过</span></div>
          <div class="m-tl"><div class="dot cur"></div><div><b>担保评审 · 周立</b><span>待出函 · 互认清单命中 2 条</span></div><span class="st">进行中</span></div>
          <div class="m-tl"><div class="dot"></div><div><b>电子签约</b><span>合同生成后推送给您</span></div></div>
        </div>
      </div>
      <div class="m-label">互认清单 <span>不转移审批责任</span></div>
      <div class="m-card" style="padding:4px 12px">
        <div class="m-listitem"><div><b>模板准入结论</b><small>脐橙 v1.3 · 双方采信</small></div><span class="m-pill">已采信</span></div>
        <div class="m-listitem"><div><b>额度区间</b><small>52—61 万元 · 区间内</small></div><span class="m-pill">已采信</span></div>
        <div class="m-listitem"><div><b>预警信号</b><small>本次无预警</small></div><span class="m-pill" style="background:#F1E5C9;border-color:#E1CFA4;color:#7C5B1D">无需采信</span></div>
      </div>
      <div class="m-note">如需补件，系统一次告知全部缺项，补齐后自动重新核验，不因换角色再要一遍。</div>
      <button class="m-btn ghost" data-action="jnext">模拟补件通过 · 进入签约</button>`;
    }
    return `
      <div class="m-hero">
        <div class="k">预授信额度 · 36 个月</div>
        <div class="v">58<small>万元</small></div>
        <div class="foot"><span>利率区间 3.75% — 4.15%</span><span>担保费 0.8%</span></div>
      </div>
      <div class="m-note" style="margin-top:8px">预授信非最终授信，以银行与农担审批为准。本页为演示测算。</div>
      <div class="m-label">当前状态 <span>5 / 5</span></div>
      <div class="m-card" style="padding:4px 12px">
        <div class="m-listitem"><div><b>电子签约</b><small>11-22 14:30 · 意愿确认已留痕</small></div><span class="m-pill">已签约</span></div>
        <div class="m-listitem"><div><b>放款到账</b><small>11-22 16:10 · 受托支付至农资供应商</small></div><span class="m-pill">58 万元</span></div>
        <div class="m-listitem"><div><b>担保函</b><small>编号 NXD-2026-0087 · 可预览</small></div><span class="m-pill">已出具</span></div>
      </div>
      <div class="m-label">还款计划 <span>宽限期 6 个月</span></div>
      <div class="m-card" style="padding:4px 12px">
        ${[["2027-05-20","本金 1.61 万","利息 0.19 万"],["2027-08-20","本金 1.61 万","利息 0.17 万"],["2027-11-20","本金 1.61 万","利息 0.15 万"]].map((x,i)=>`<div class="m-listitem"><div><b>第 ${i+1} 期 · ${x[0]}</b><small>${x[1]} + ${x[2]}</small></div><span class="m-pill" style="background:#F8F4E9;border-color:#D8CFB9;color:#6B7368">待还</span></div>`).join("")}
      </div>
      <div class="m-note">保后：12 次数据监测 + 2 次现场核验，替代每年 4 次上门。预警核查 48 小时内响应。</div>
      <button class="m-btn ghost" data-action="jreset">回到第一步 · 重新体验</button>`;
  }

  /* ---------- MODAL ---------- */
  function renderModal(){
    if(!S.modal) return "";
    let body = "", foot = "";
    if(S.modal.type==="approve"){
      body = `<div class="modal-text">审批对象：<b>NX2026120007 · 瑞金市橙丰家庭农场</b><br>建议额度 <b>58 万元</b>，系统结论为「建议通过」。审批结论由人工签批，规则不直接置位。</div>
        <div style="margin-top:14px"><label style="font-size:10px;letter-spacing:.1em;color:var(--ink-3);display:block;margin-bottom:6px">审批意见</label>
        <textarea class="input" id="approveOpinion" rows="3">同意授信 58 万元，期限 36 个月，按脐橙模板 v1.3 口径执行；放款前确认保单在保。</textarea></div>
        <div class="warn-line">通过后单据流转至 S09，事件表记录操作人、角色、机构、前后状态、意见与耗时。</div>`;
      foot = `<button class="btn btn-ghost" data-action="close-modal">取消</button><button class="btn btn-primary" data-action="confirm-approve">确认通过 · S09</button>`;
    }
    if(S.modal.type==="reject"){
      body = `<div class="modal-text">退回补件会将单据流转至 <b>S06 待补材料</b>，并向客户发送一次告知清单。已采集材料继续复用。</div>
        <div style="margin-top:14px"><label style="font-size:10px;letter-spacing:.1em;color:var(--ink-3);display:block;margin-bottom:6px">退回原因</label>
        <textarea class="input" id="rejectReason" rows="3">订单合同缺少收购方盖章页，请补充完整后重新提交。</textarea></div>`;
      foot = `<button class="btn btn-ghost" data-action="close-modal">取消</button><button class="btn btn-danger" data-action="confirm-reject">确认退回 · S06</button>`;
    }
    if(S.modal.type==="letter"){
      body = `<div class="modal-text">即将为 <b>遂川县青岭油茶专业合作社</b> 出具担保函，金额 <b>188 万元</b>，期限 60 个月。签章由农担既有 CA 平台完成，平台只做任务编排与回执归档。</div>
        <div class="warn-line">出具后不可撤回，需重新出具作废函；编号按机构与年月生成。</div>
        <div class="seal-stamp">江西省农业信贷<br>融资担保有限公司<br>担保专用章</div>`;
      foot = `<button class="btn btn-ghost" data-action="close-modal">取消</button><button class="btn btn-gold" data-action="confirm-letter">确认出具担保函</button>`;
    }
    if(S.modal.type==="publish"){
      body = `<div class="modal-text">发布 <b>赣南脐橙 v1.5</b>？发布后仅影响新提交单据，在途单据继续使用提交时锁定的 v1.3 快照。</div>
        <div style="margin-top:12px"><label style="font-size:10px;letter-spacing:.1em;color:var(--ink-3);display:block;margin-bottom:6px">灰度比例</label><input class="input num" type="number" value="20" /></div>
        <div class="warn-line">发布前需通过 3 组样例试算；发布后生成版本号并记录审批人。</div>`;
      foot = `<button class="btn btn-ghost" data-action="close-modal">取消</button><button class="btn btn-primary" data-action="confirm-publish">确认发布 v1.5</button>`;
    }
    if(S.modal.type==="rollback"){
      body = `<div class="modal-text">回滚 <b>v1.4 → v1.3</b>？灰度中的 20% 流量将立即切回 v1.3，无需发版，回滚时间不超过 10 分钟。</div>
        <div class="warn-line">回滚记录写入审计日志；已生成快照的在途单据不受影响。</div>`;
      foot = `<button class="btn btn-ghost" data-action="close-modal">取消</button><button class="btn btn-danger" data-action="confirm-rollback">确认回滚</button>`;
    }
    return `<div class="modal-mask">
      <div class="modal">
        <div class="modal-head"><h3>${S.modal.type==="letter"?"出具担保函":S.modal.type==="publish"?"发布规则版本":S.modal.type==="rollback"?"回滚规则版本":S.modal.type==="reject"?"退回补件":"审批处理"}</h3><button class="close" data-action="close-modal">×</button></div>
        <div class="modal-body">${body}</div>
        <div class="modal-foot">${foot}</div>
      </div>
    </div>`;
  }

  function toast(msg){
    S.toast = msg;
    render();
    clearTimeout(S.toastTimer);
    S.toastTimer = setTimeout(()=>{ S.toast = null; render(); }, 2600);
  }

  /* ---------- RENDER ---------- */
  function render(){
    const app = document.getElementById("app");
    if(!S.role){ app.innerHTML = renderCover() + (S.toast?`<div class="toast"><i></i>${esc(S.toast)}</div>`:""); return; }
    if(S.role==="client"){
      app.innerHTML = `<div class="shell" style="grid-template-columns:1fr">
        <main class="main">
          <header class="topbar">
            <div class="crumb"><span>兴农联担</span><span>/</span><b>客户 H5</b><span>/</span><span>五步旅程</span></div>
            <div class="topbar-right"><span class="demo-tag"><i></i>${esc(D.meta.env)}</span><span class="role-pill">${icon("user")}客户</span><button class="switch-role" data-action="switch-role">切换角色</button></div>
          </header>
          ${clientJourney()}
        </main>
      </div>` + (S.toast?`<div class="toast"><i></i>${esc(S.toast)}</div>`:"") + renderModal();
      return;
    }
    const page = {
      "bank-home":bankHome, "bank-pool":bankPool, "bank-detail":bankDetail,
      "g-home":gHome, "g-review":gReview,
      "admin-tpl":adminTpl, "admin-rules":adminRules, "admin-source":adminSource, "admin-audit":adminAudit
    }[S.view] || bankHome;
    app.innerHTML = renderShell(page()) + (S.toast?`<div class="toast"><i></i>${esc(S.toast)}</div>`:"") + renderModal();
  }

  /* ---------- 事件 ---------- */
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-role],[data-nav],[data-app],[data-tab],[data-field],[data-jstep],[data-action],[data-cite],[data-veto],[data-warn]");
    if(!el) return;

    if(el.dataset.role){
      S.role = el.dataset.role;
      S.view = { client:"client", bank:"bank-home", guarantee:"g-home", admin:"admin-tpl" }[S.role];
      S.tab = "overview"; S.modal = null; render(); return;
    }
    if(el.dataset.nav){
      S.view = el.dataset.nav;
      if(S.view==="bank-detail") S.tab = "overview";
      S.modal = null; render(); return;
    }
    if(el.dataset.app){
      const no = el.dataset.app;
      if(no==="NX2026120007"){
        S.role = "bank"; S.view = "bank-detail"; S.tab = "overview"; render();
      } else {
        toast("该单据为列表造数；完整演示请打开 NX2026120007");
      }
      return;
    }
    if(el.dataset.tab){ S.tab = el.dataset.tab; render(); return; }
    if(el.dataset.field){ S.field = el.dataset.field; render(); return; }
    if(el.dataset.jstep!==undefined && el.classList.contains("jstep")){
      S.jstep = parseInt(el.dataset.jstep); render(); return;
    }
    if(el.dataset.cite){
      const map = { "F-01":"遥感核验面积 · 118.6 亩","F-02":"NDVI 时序 · 0.71","F-03":"灾情图斑 · 未发现","F-04":"近三年销售收入","F-07":"近 12 月回款流水","F-09":"投保面积 · 110 亩","F-11":"额度公式 v1.3","F-12":"系数构成 0.98","F-15":"政策上限 300 万元" };
      toast("引用 " + el.dataset.cite + " → " + (map[el.dataset.cite] || "结构化字段"));
      return;
    }
    if(el.dataset.veto){
      const k = el.dataset.veto; S.tpl.veto[k] = !S.tpl.veto[k];
      el.classList.toggle("on", S.tpl.veto[k]);
      el.querySelector("i").textContent = S.tpl.veto[k] ? "✓" : "";
      refreshTrial(); return;
    }
    if(el.dataset.warn){
      const k = el.dataset.warn; S.tpl.warn[k] = !S.tpl.warn[k];
      el.classList.toggle("on", S.tpl.warn[k]);
      el.querySelector("i").textContent = S.tpl.warn[k] ? "✓" : "";
      return;
    }

    const a = el.dataset.action;
    switch(a){
      case "switch-role":
        S.role = null; S.view = "cover"; S.modal = null; render(); break;
      case "toast":
        toast(el.dataset.msg || "演示操作"); break;
      case "jnext":
        if(S.jstep < 4) S.jstep++; render(); break;
      case "jreset":
        S.jstep = 0; render(); break;
      case "filter-industry":
        S.poolIndustry = el.dataset.ind; render(); break;
      case "reset-pool":
        S.poolIndustry = "全部"; S.poolQuery = ""; render(); break;
      case "search": {
        const q = document.getElementById("poolSearch");
        S.poolQuery = q ? q.value.trim() : ""; render(); break;
      }
      case "toggle-coef":
        S.coefOn[el.dataset.key] = !S.coefOn[el.dataset.key];
        S.adjust = null; render(); break;
      case "adjust": {
        const amt = parseFloat(document.getElementById("adjAmt")?.value || "0");
        const reason = (document.getElementById("adjReason")?.value || "").trim();
        const base = limitCalc().suggest;
        if(!amt || !reason){ toast("请填写调整额度与理由"); break; }
        S.adjust = { amount: amt, reason, delta: (amt-base)/base*100, over20: Math.abs((amt-base)/base) > 0.2 };
        toast(S.adjust.over20 ? "已留痕，并进入复核队列" : "调整已留痕，原测算值保留");
        break;
      }
      case "approve":
        S.modal = { type:"approve" }; render(); break;
      case "reject":
        S.modal = { type:"reject" }; render(); break;
      case "letter":
        S.modal = { type:"letter" }; render(); break;
      case "publish":
        S.modal = { type:"publish" }; render(); break;
      case "rollback":
        S.modal = { type:"rollback" }; render(); break;
      case "select-tpl":
        if(parseInt(el.dataset.idx)===0){ S.tplIdx = 0; render(); }
        else toast("模板列表为造数；编辑区以赣南脐橙 v1.5 为例");
        break;
      case "close-modal":
        S.modal = null; render(); break;
      case "confirm-approve": {
        const d = D.detail;
        d.state = "银行审批通过"; d.stateCode = "S09";
        const a = D.apps.find(x=>x.no==="NX2026120007");
        if(a){ a.state = "银行审批通过"; a.stateCode = "S09"; a.tone = "green"; }
        S.modal = null;
        toast("审批已通过 · S09，事件已留痕");
        break;
      }
      case "confirm-reject": {
        const d = D.detail;
        d.state = "待补材料"; d.stateCode = "S06";
        const a = D.apps.find(x=>x.no==="NX2026120007");
        if(a){ a.state = "待补材料"; a.stateCode = "S06"; a.tone = "amber"; a.manager = "陈旻"; }
        S.modal = null;
        toast("已退回补件 · S06，一次告知清单已发送");
        break;
      }
      case "confirm-letter":
        D.guarantee.reviewTarget.status = "担保函已出具";
        S.modal = null;
        toast("担保函 NXD-2026-0087 已出具，回执已归档");
        break;
      case "confirm-publish":
        S.modal = null;
        toast("v1.5 已发布，灰度 20%，在途单据继续使用 v1.3 快照");
        break;
      case "confirm-rollback":
        S.modal = null;
        toast("已回滚至 v1.3，记录写入审计日志");
        break;
    }
  });

  document.addEventListener("keydown", e => {
    if(e.key==="Enter" && e.target.id==="poolSearch"){
      S.poolQuery = e.target.value.trim(); render();
    }
  });

  document.addEventListener("input", e => {
    if(e.target.id==="grayRange"){
      S.gray = parseInt(e.target.value);
      const v = document.getElementById("grayVal");
      if(v) v.textContent = S.gray + "%";
      return;
    }
    const key = e.target.dataset.live;
    if(key){
      const v = parseFloat(e.target.value);
      if(!isNaN(v)){ S.tpl[key] = v; refreshTrial(); }
    }
  });

  function refreshTrial(){
    const list = document.getElementById("trial-list");
    if(!list) return;
    list.innerHTML = D.admin.trial.samples.map((s,i)=>{
      const r = tplCalc(s);
      const veto = Object.values(S.tpl.veto).some(Boolean);
      return `<div class="trial">
        <div class="trial-head"><b>${esc(s.name)}</b><span class="flag">样例 ${i+1}</span></div>
        <div class="trial-line"><span>销售收入 × 0.56</span><strong>${(s.sales*0.56).toFixed(2)} 万元</strong></div>
        <div class="trial-line"><span>面积 × 亩均投入 × 系数</span><strong>${(s.area*s.perMu*S.tpl.coef/10000).toFixed(2)} 万元</strong></div>
        <div class="trial-line"><span>政策上限</span><strong>${S.tpl.cap} 万元</strong></div>
        <div class="trial-result"><span style="font-size:10px;color:var(--ink-3)">建议额度</span><span class="amt">${veto?"转人工":nf(r)+" 万元"}</span></div>
      </div>`;
    }).join("");
    const flag = document.getElementById("trial-flag");
    if(flag){
      const veto = Object.values(S.tpl.veto).some(Boolean);
      flag.className = "pill " + (veto ? "pill-amber" : "pill-green");
      flag.innerHTML = `<i></i>${veto?"1 项否决命中":"3 / 3 通过"}`;
    }
    const vs = document.getElementById("veto-state");
    if(vs) vs.textContent = Object.values(S.tpl.veto).some(Boolean) ? "命中 · 试算转人工复核" : "未命中";
    const json = document.getElementById("rule-json");
    if(json) json.innerHTML = ruleJson();
  }

  /* 深链：便于评审时直接打开某一端、某一页签 */
  (function initFromHash(){
    const h = decodeURIComponent(location.hash.replace(/^#/, ""));
    if(!h) return;
    const [role, view, tab] = h.split("/");
    if(!["client","bank","guarantee","admin"].includes(role)) return;
    S.role = role;
    const fallback = { client:"client", bank:"bank-home", guarantee:"g-home", admin:"admin-tpl" }[role];
    S.view = view || fallback;
    S.tab = tab || "overview";
  })();

  render();
})();

</script>
</body>
</html>
